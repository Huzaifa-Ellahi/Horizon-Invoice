/* ---------- New invoice: customer first, always ---------- */
ACT.newInvoice = el => {
  const custs = visibleCustomers().slice().sort((a, b) => a.name.localeCompare(b.name));
  const preset = el && el.dataset.customer;
  const staff = role => D('users').filter(u => u.active !== false && roleOf(u).permissions[role]);
  const cos = D('companies');
  const pms = cos.flatMap(co => (co.paymentMethods || []).map(p => ({ co, p })));
  if (!custs.length) { toast('Create a customer first \u2014 every invoice belongs to a customer.', 'bad'); return ACT.newCustomer(); }
  modal({ title: 'New invoice', sub: 'Pick the customer first. The invoice number is generated on save.', wide: true, body: `<div class="form-grid">
    ${field('Customer *', `<select name="customerId"><option value="">Select customer\u2026</option>${custs.map(c => opt(c.id, c.code + ' \u2014 ' + c.name + ' (' + c.country + ')', preset)).join('')}</select><span class="hint">Not listed? <a href="#" data-act="newCustomer" data-close>Create the customer</a> first.</span>`, 'full')}
    ${field('Issuing company *', `<select name="companyId">${cos.map(co => opt(co.id, co.name + ' (' + co.code + ')')).join('')}</select><span class="hint">Sets the letterhead, logo and stamp.</span>`)}
    ${field('Payment method *', `<select name="paymentMethodId">${pms.map(x => opt(x.p.id, x.p.label + ' \u2014 ' + x.co.code)).join('')}</select>`)}
    ${field('Sales person', `<select name="salesUserId">${staff('invoices.create').map(u => opt(u.id, u.name, App.me.id)).join('')}</select>`)}
    ${field('Manager <em>(uploads payment receipt)</em>', `<select name="managerId"><option value="">Unassigned</option>${staff('payments.upload_receipt').map(u => opt(u.id, u.name)).join('')}</select>`)}
    ${field('Accountant <em>(uploads SWIFT)</em>', `<select name="accountantId"><option value="">Unassigned</option>${staff('payments.upload_swift').map(u => opt(u.id, u.name)).join('')}</select>`)}
    <div></div>
    <div class="full fset" style="margin-top:4px"><h3>Optional \u2014 vehicle reference</h3><div class="form-grid">
      ${field('Stock ID <em>(optional)</em>', `<input type="text" name="stockId" list="stockList" placeholder="e.g. 20198"><datalist id="stockList">${D('vehicles').filter(v => R.ASSIGNABLE_STATUSES.includes(v.status)).map(v => `<option value="${esc(v.stockId)}">${esc(v.year + ' ' + v.make + ' ' + v.model + ' \u2014 ' + v.location)}</option>`).join('')}</datalist><span class="hint">A preference only. Operations confirms the final stock ID after the job card.</span>`)}
      ${field('Chassis no. <em>(optional)</em>', '<input type="text" name="chassisNo">')}
    </div></div></div>`,
    foot: [{ label: 'Cancel' }, { label: 'Create invoice', cls: 'primary', after: false, act: async m => {
      need(m, ['customerId', 'companyId']);
      const v = formVals(m); const c = customer(v.customerId); const co = company(v.companyId);
      let row = { location: 'THAILAND', bodyType: '', makeModel: '', year: '', color: '', fuel: 'Diesel', engine: '', transmission: 'Automatic', cnf: '' };
      if (v.stockId) {
        const veh = vehicleByStock(v.stockId);
        if (!veh) throw new Error('Stock ' + v.stockId + ' is not in Stock or Deposit inventory. Leave it blank or add the vehicle first.');
        row = { location: String(veh.location || '').toUpperCase(), bodyType: String(veh.bodyType || '').toUpperCase(), makeModel: (veh.make + ' ' + veh.model).toUpperCase(), year: String(veh.year || ''), color: String(veh.color || '').toUpperCase(), fuel: veh.fuel || 'Diesel', engine: String(veh.engine || '').toUpperCase(), transmission: veh.transmission || 'Automatic', cnf: veh.sellingPrice || '' };
        if (!v.chassisNo) v.chassisNo = veh.chassisNo || '';
      }
      const inv = await svc.insert('invoices', {
        customerId: c.id, companyId: co.id, companyCode: co.code, paymentMethodId: v.paymentMethodId, salesUserId: v.salesUserId || App.me.id,
        managerId: v.managerId || null, accountantId: v.accountantId || null, requestedStockId: v.stockId || '', requestedChassisNo: v.chassisNo || '',
        stockId: '', chassisNo: '', stage: 'draft', stageHistory: [{ stage: 'draft', at: nowIso(), by: App.me.id }], paymentConfirmed: false,
        date: new Date().toISOString().slice(0, 10), currency: settings().currency || 'USD', depositReceived: '',
        consigneeName: c.name, consigneeAddress: [c.address, c.city, c.country].filter(Boolean).join(', '), consigneeEmail: c.email, consigneeContact: c.phone,
        notifyName: '', notifyAddress: '', notifyEmail: '', notifyTel: '', shipmentType: 'RORO', dischargePort: '', finalDestination: c.country || '',
        notes: settings().invoiceNotes || '', rows: [row], finalPhotos: [], shipment: {}, sentLog: [],
      });
      await svc.audit('invoice', inv.id, 'Created invoice ' + inv.invoiceNo, 'for ' + c.code + ' ' + c.name, inv.id);
      toast(inv.invoiceNo + ' created for ' + c.name, 'ok');
      m.close(); go('#/deals/' + inv.id + '/invoice');
      return false;
    } }] });
};

<script>
/* Horizon Vehicles ERP — the deal workspace (one invoice, end to end). */

const TABS = [
  ['invoice', 'Invoice'], ['payment', 'Payment'], ['jobcard', 'Job card'], ['stock', 'Stock & chassis'],
  ['workshop', 'Workshop'], ['review', 'Final review'], ['shipping', 'Shipping'], ['costing', 'Costing'], ['activity', 'Activity'],
];
function defaultTab(inv, kind) {
  if (kind === 'swift') return 'payment';
  return ({ draft: 'invoice', sent: 'payment', receipt_uploaded: 'jobcard', job_card: 'stock', stock_assigned: 'workshop', in_workshop: 'workshop', qc_review: 'review', sales_approved: 'review', sold: 'shipping', completed: 'costing' })[inv.stage] || 'invoice';
}
const atLeast = (inv, st) => R.STAGE_INDEX[inv.stage] >= R.STAGE_INDEX[st];
const activeDocs = (inv, type) => D('documents').filter(d => d.invoiceId === inv.id && d.docType === type);
const findPM = id => { for (const co of D('companies')) { const p = (co.paymentMethods || []).find(x => x.id === id); if (p) return p; } return null; };
const coLogo = co => co.logoFile ? fileUrl(co.logoFile) : (A[co.logoKey] || A.logoHV || '');
const coStamp = co => co.stampFile ? fileUrl(co.stampFile) : (A[co.stampKey] || A.stampHV || '');
const canEditInvoice = inv => can('invoices.create') && R.STAGE_INDEX[inv.stage] <= R.STAGE_INDEX.sent;

/* ---------- Proforma document (ported from the invoicing app) ---------- */
function invoiceDocHtml(inv) {
  const co = company(inv.companyId); const pm = findPM(inv.paymentMethodId);
  const total = R.invoiceTotal(inv), dep = R.num(inv.depositReceived);
  const cur = inv.currency || 'USD';
  const m = n => R.num(n).toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' ' + cur;
  const stock = inv.stockId || inv.requestedStockId, chassis = inv.chassisNo || inv.requestedChassisNo;
  const rows = (inv.rows || []).map(r => `<tr><td>${esc(r.location)}</td><td>${esc(r.bodyType)}</td><td>${esc(r.makeModel)}</td><td>${esc(r.year)}</td><td>${esc(r.color)}</td><td>${esc(r.fuel)}</td><td>${esc(r.engine)}</td><td>${esc(r.transmission)}</td><td class="num">${r.cnf !== '' && r.cnf != null ? m(r.cnf) : '\u2014'}</td></tr>`).join('');
  const flag = co.flag === 'thai' ? ['#c8102e', '#fff', '#1b2a5c'] : ['#46267E', '#fff', '#1b2a5c'];
  return `<div class="invdoc" id="invdoc">
    <div class="band"><div><h1>${esc(co.name)}</h1><p>${esc(co.address)}</p><p>${esc(co.phoneLine)}</p></div><div class="band-logo"><img src="${coLogo(co)}" alt="${esc(co.name)} logo"></div></div>
    <div class="flag">${flag.map(c => `<div style="background:${c}"></div>`).join('')}</div>
    <div class="titlebar">PROFORMA INVOICE</div>
    <div class="meta"><div><h4>Consignee</h4>
      <div class="ml"><b>Name</b> ${esc(inv.consigneeName) || '\u2014'}</div><div class="ml"><b>Address</b> ${esc(inv.consigneeAddress) || '\u2014'}</div>
      <div class="ml"><b>Email</b> ${esc(inv.consigneeEmail) || '\u2014'}</div><div class="ml"><b>Contact</b> ${esc(inv.consigneeContact) || '\u2014'}</div></div>
      <div><h4>Invoice details</h4><table class="kv"><tr><td>Invoice No.</td><td>${esc(inv.invoiceNo)}</td></tr><tr><td>Date</td><td>${fmtDate(inv.date)}</td></tr>
      <tr><td>Customer ID</td><td>${esc((customer(inv.customerId) || {}).code || '')}</td></tr>
      ${stock ? `<tr><td>Stock ID</td><td>${esc(stock)}</td></tr>` : ''}${chassis ? `<tr><td>Chassis No.</td><td>${esc(chassis)}</td></tr>` : ''}</table></div></div>
    <div class="meta" style="padding-top:6px"><div><h4>Notify party</h4>
      <div class="ml"><b>Name</b> ${esc(inv.notifyName) || '\u2014'}</div><div class="ml"><b>Address</b> ${esc(inv.notifyAddress) || '\u2014'}</div>
      <div class="ml"><b>Email</b> ${esc(inv.notifyEmail) || '\u2014'}</div><div class="ml"><b>Tel</b> ${esc(inv.notifyTel) || '\u2014'}</div></div>
      <div><h4>Shipping information</h4><table class="kv"><tr><td>Shipment Type</td><td>${esc(inv.shipmentType) || '\u2014'}</td></tr><tr><td>Discharge Port</td><td>${esc(inv.dischargePort) || '\u2014'}</td></tr><tr><td>Final Destination</td><td>${esc(inv.finalDestination) || '\u2014'}</td></tr></table></div></div>
    <table class="veh"><thead><tr><th>Location</th><th>Body Type</th><th>Make And Model</th><th>Year Of Reg.</th><th>Color</th><th>Fuel</th><th>Engine Size</th><th>Transmission</th><th class="num">CNF</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="totals"><div>
      <div class="tr"><span>Total cost of vehicle &amp; freight${inv.dischargePort ? ' till ' + esc(inv.dischargePort) + ' port' : ''}</span><span>${m(total)}</span></div>
      <div class="tr"><span>Deposit received</span><span>${m(dep)}</span></div>
      <div class="tr final"><span>Required deposit payment</span><span>${m(total - dep)}</span></div></div></div>
    <div class="foot"><div class="stamp"><img src="${coStamp(co)}" alt="${esc(co.name)} stamp"><div class="cap">Authorized stamp \u2014 ${esc(co.name)}</div></div>
      <div class="bank"><h4>${esc(pm ? pm.label : 'Payment details')}</h4><div class="rows">${pm ? (pm.fields || []).map(f => `<div class="br"><span>${esc(f.label)}</span><span>${esc(f.value) || '\u2014'}</span></div>`).join('') : '<div class="br"><span>No payment method selected.</span></div>'}</div></div></div>
    <div class="notes">${esc(inv.notes || '').replace(/\n/g, '<br>')}</div></div>`;
}

/* ---------- Route header ---------- */
function routeHeader(inv) {
  const c = customer(inv.customerId); const idx = R.STAGE_INDEX[inv.stage];
  const nx = R.NEXT_ACTION[inv.stage];
  const whoCan = nx ? D('users').filter(u => u.active !== false && roleOf(u).permissions[nx.perm]).map(u => u.name) : [];
  const mine = nx && can(nx.perm);
  return `<div class="route">
    <div class="route-top"><div>
      <div class="route-title"><h1>${esc(inv.invoiceNo)}</h1>${inv.stockId ? `<span class="plate lg">${esc(inv.stockId)}</span>` : ''}${inv.stage === 'completed' ? '<span class="tag ok">Shipped</span>' : inv.stage === 'sold' ? '<span class="tag dark">SOLD</span>' : ''}</div>
      <div class="route-meta"><b><a href="#/customers/${c ? c.id : ''}" style="color:inherit">${esc(c ? c.name : '?')}</a></b> ${esc(c ? c.code : '')} \u2014 ${esc(company(inv.companyId).name)} \u2014 sales: <b>${esc(userName(inv.salesUserId))}</b> \u2014 total <b>${money(R.invoiceTotal(inv))}</b>${inv.chassisNo ? ' \u2014 chassis <b>' + esc(inv.chassisNo) + '</b>' : ''}</div></div>
      <div class="row">${slaBadge(inv, true)}${inv.paymentConfirmed ? '<span class="tag ok">Payment confirmed</span>' : atLeast(inv, 'receipt_uploaded') ? '<span class="tag warn">SWIFT pending</span>' : ''}</div></div>
    <div class="stations">${R.STAGES.map((s, i) => `<div class="station ${i < idx ? 'done' : i === idx ? 'now' : ''}"><span class="pin"></span><span class="nm">${s.label}</span><span class="dp">${s.dept}</span></div>`).join('')}</div>
    ${nx ? `<div class="next-bar"><div><div class="who">${mine ? 'Your move' : 'Waiting on ' + esc(R.STAGE[R.STAGES[Math.min(idx + 1, 9)].key].dept) + (whoCan.length ? ' (' + esc(whoCan.slice(0, 3).join(', ')) + (whoCan.length > 3 ? '\u2026' : '') + ')' : '')}</div><div class="what">${esc(nx.text)}</div></div>
      ${mine ? `<a class="btn" href="#/deals/${inv.id}/${defaultTab(inv)}">Go to step</a>` : ''}</div>` : '<div class="next-bar"><div class="what">Deal complete \u2014 vehicle shipped with all documents.</div></div>'}
  </div>`;
}

App.pages.deal = {
  render(r) {
    const inv = byId('invoices', r.id);
    if (!inv || !visibleInvoices().includes(inv)) return '<div class="empty"><h3>Invoice not found</h3><p>It may belong to another team.</p></div>';
    const tab = r.tab || defaultTab(inv);
    const counts = { workshop: D('workOrders').filter(w => w.invoiceId === inv.id).length, activity: D('audit').filter(a => a.invoiceId === inv.id).length };
    const body = ({ invoice: tabInvoice, payment: tabPayment, jobcard: tabJobCard, stock: tabStock, workshop: tabWorkshop, review: tabReview, shipping: tabShipping, costing: tabCosting, activity: tabActivity })[tab] || tabInvoice;
    return `<div class="crumbs"><a href="#/deals">Invoices & deals</a> / ${esc(inv.invoiceNo)}</div>${routeHeader(inv)}
      <nav class="tabs">${TABS.map(([k, l]) => `<a href="#/deals/${inv.id}/${k}" class="${k === tab ? 'on' : ''}">${l}${counts[k] ? `<span class="n">${counts[k]}</span>` : ''}</a>`).join('')}</nav>
      <div id="dealBody">${body(inv)}</div>`;
  },
  mount(r) { const inv = byId('invoices', r.id); if (!inv) return; const t = r.tab || defaultTab(inv); if (t === 'invoice') mountInvoiceEditor(inv); if ($('#jcForm')) jcRefresh(); },
};

/* ---------- Tab: Invoice ---------- */
function tabInvoice(inv) {
  const edit = canEditInvoice(inv);
  const pms = D('companies').flatMap(co => (co.paymentMethods || []).map(p => ({ co, p })));
  const f = (label, k, type) => field(label, `<input type="${type || 'text'}" data-f="${k}" value="${esc(inv[k])}" ${edit ? '' : 'disabled'}>`);
  const rowEditor = (inv.rows || []).map((r, i) => `<div class="docslot" style="margin-bottom:10px"><div class="row between"><b class="small">Vehicle line ${i + 1}</b>${edit && inv.rows.length > 1 ? `<button class="btn sm danger" data-act="invRowDel" data-i="${i}">Remove</button>` : ''}</div>
    <div class="form-grid" style="margin-top:8px">${[['location', 'Location'], ['bodyType', 'Body type'], ['makeModel', 'Make & model'], ['year', 'Year of reg.'], ['color', 'Color'], ['fuel', 'Fuel'], ['engine', 'Engine size'], ['transmission', 'Transmission'], ['cnf', 'CNF price']].map(([k, l]) =>
      field(l, `<input type="${k === 'cnf' ? 'number' : 'text'}" data-row="${i}" data-rf="${k}" value="${esc(r[k])}" ${edit ? '' : 'disabled'}>`)).join('')}</div></div>`).join('');
  const cust = customer(inv.customerId);
  return `<div class="inv-layout"><div class="card">
      ${edit ? '' : `<div class="notice" style="margin-bottom:12px">Invoice content is locked after it\u2019s sent and the payment receipt arrives. ${can('invoices.create') ? '' : 'You have read-only access.'}</div>`}
      <div class="form-grid">
        ${field('Issuing company', `<select data-f="companyId" ${edit ? '' : 'disabled'}>${D('companies').map(co => opt(co.id, co.name, inv.companyId)).join('')}</select>`)}
        ${field('Payment method', `<select data-f="paymentMethodId" ${edit ? '' : 'disabled'}>${pms.map(x => opt(x.p.id, x.p.label + ' \u2014 ' + x.co.code, inv.paymentMethodId)).join('')}</select>`)}
        ${f('Invoice date', 'date', 'date')}${f('Currency', 'currency')}
      </div>
      <div class="fset"><h3>Consignee</h3><div class="form-grid">${f('Name', 'consigneeName')}${f('Email', 'consigneeEmail', 'email')}${f('Contact', 'consigneeContact')}${f('Address', 'consigneeAddress')}</div></div>
      <div class="fset"><h3>Notify party</h3><div class="form-grid">${f('Name', 'notifyName')}${f('Email', 'notifyEmail', 'email')}${f('Tel', 'notifyTel')}${f('Address', 'notifyAddress')}</div></div>
      <div class="fset"><h3>Shipping</h3><div class="form-grid">${field('Shipment type', `<select data-f="shipmentType" ${edit ? '' : 'disabled'}>${['RORO', 'Container', 'Air', 'Road'].map(x => opt(x, x, inv.shipmentType)).join('')}</select>`)}${f('Discharge port', 'dischargePort')}${f('Final destination', 'finalDestination')}${f('Deposit received', 'depositReceived', 'number')}</div></div>
      <div class="fset"><h3>Optional vehicle reference</h3><div class="form-grid">${f('Stock ID (requested)', 'requestedStockId')}${f('Chassis no. (requested)', 'requestedChassisNo')}</div><p class="small muted" style="margin:6px 0 0">Operations assigns the confirmed stock ID and chassis on the Stock tab.</p></div>
      <div class="fset"><h3>Vehicles</h3>${rowEditor}${edit ? '<button class="btn sm" data-act="invRowAdd">Add vehicle line</button>' : ''}</div>
      <div class="fset"><h3>Notes</h3><textarea data-f="notes" ${edit ? '' : 'disabled'}>${esc(inv.notes)}</textarea></div>
      <p class="small faint" id="saveState" style="margin:10px 0 0">${edit ? 'Changes save automatically.' : ''}</p>
    </div>
    <div class="stack"><div class="inv-scroll" id="invPreview">${invoiceDocHtml(inv)}</div>
      <div class="grid g3">
        <div class="card"><h3 style="margin-bottom:8px">Download</h3><button class="btn dark" style="width:100%" data-act="invPrint" data-id="${inv.id}">Download PDF</button></div>
        <div class="card"><h3 style="margin-bottom:8px">Email the customer</h3><button class="btn primary" style="width:100%" data-act="invSend" data-ch="email" data-id="${inv.id}" ${can('invoices.send') ? '' : 'disabled'}>Send via email</button></div>
        <div class="card"><h3 style="margin-bottom:8px">WhatsApp the customer</h3><button class="btn wa" style="width:100%" data-act="invSend" data-ch="wa" data-id="${inv.id}" ${can('invoices.send') && cust ? '' : 'disabled'}>Send via WhatsApp</button></div>
      </div>
      ${inv.stage === 'draft' && can('invoices.send') ? `<div class="notice">Sending by email or WhatsApp marks the invoice as sent. Already sent it another way? <a href="#" data-act="invMarkSent" data-id="${inv.id}">Mark as sent</a>.</div>` : ''}
      ${(inv.sentLog || []).length ? `<div class="card"><h3>Sent log</h3><ul class="feed">${inv.sentLog.map(s => `<li>${esc(s.channel)} to ${esc(s.to)} by ${esc(userName(s.by))}<time>${fmtDT(s.at)}</time></li>`).join('')}</ul></div>` : ''}
    </div></div>`;
}
function mountInvoiceEditor(inv) {
  if (!canEditInvoice(inv)) return;
  let timer = null;
  const draft = JSON.parse(JSON.stringify(inv));
  const save = () => {
    clearTimeout(timer); $('#saveState').textContent = 'Saving\u2026';
    timer = setTimeout(async () => {
      try {
        const co = company(draft.companyId);
        await svc.update('invoices', inv.id, { companyId: draft.companyId, companyCode: co.code, paymentMethodId: draft.paymentMethodId, date: draft.date, currency: draft.currency,
          consigneeName: draft.consigneeName, consigneeEmail: draft.consigneeEmail, consigneeContact: draft.consigneeContact, consigneeAddress: draft.consigneeAddress,
          notifyName: draft.notifyName, notifyEmail: draft.notifyEmail, notifyTel: draft.notifyTel, notifyAddress: draft.notifyAddress, shipmentType: draft.shipmentType,
          dischargePort: draft.dischargePort, finalDestination: draft.finalDestination, depositReceived: draft.depositReceived, requestedStockId: draft.requestedStockId,
          requestedChassisNo: draft.requestedChassisNo, rows: draft.rows, notes: draft.notes });
        const el = $('#saveState'); if (el) el.textContent = 'Saved ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      } catch (e) { fail(e); }
    }, 500);
  };
  const body = $('#dealBody');
  body.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.f) draft[t.dataset.f] = t.value;
    else if (t.dataset.rf) draft.rows[+t.dataset.row][t.dataset.rf] = t.value;
    else return;
    $('#invPreview').innerHTML = invoiceDocHtml(draft);
    save();
  });
  body.addEventListener('change', e => { if (e.target.tagName === 'SELECT') e.target.dispatchEvent(new Event('input', { bubbles: true })); });
  App.ui.invDraft = draft;
}
ACT.invRowAdd = async () => { const d = App.ui.invDraft; d.rows.push({ location: 'THAILAND', bodyType: '', makeModel: '', year: '', color: '', fuel: 'Diesel', engine: '', transmission: 'Automatic', cnf: '' }); await svc.update('invoices', d.id, { rows: d.rows }); route(); };
ACT.invRowDel = async el => { const d = App.ui.invDraft; d.rows.splice(+el.dataset.i, 1); await svc.update('invoices', d.id, { rows: d.rows }); route(); };
ACT.invPrint = () => { const doc = $('#invdoc'); doc.classList.add('print-target'); window.print(); setTimeout(() => doc.classList.remove('print-target'), 500); };
async function markSent(inv, channel, to) {
  const log = (inv.sentLog || []).concat([{ channel, to, at: nowIso(), by: App.me.id }]);
  if (inv.stage === 'draft') await svc.setStage(inv, 'sent', { sentLog: log, sentAt: nowIso() }, 'via ' + channel);
  else { await svc.update('invoices', inv.id, { sentLog: log }); await svc.audit('invoice', inv.id, 'Re-sent invoice via ' + channel, to, inv.id); }
}
ACT.invSend = async el => {
  const inv = byId('invoices', el.dataset.id); const c = customer(inv.customerId); const co = company(inv.companyId);
  const total = money(R.invoiceTotal(inv)); const bal = money(R.invoiceBalance(inv));
  const text = `Dear ${inv.consigneeName || (c && c.name)},\n\nPlease find your proforma invoice ${inv.invoiceNo} from ${co.name}.\nTotal: ${total}\nRequired deposit payment: ${bal}\n\nBank details are on the invoice. Please share the payment receipt once the transfer is made.\n\nThank you,\n${App.me.name}\n${co.name}`;
  if (el.dataset.ch === 'email') {
    const to = inv.consigneeEmail || (c && c.email);
    window.open(`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent('Proforma Invoice ' + inv.invoiceNo + ' \u2014 ' + co.name)}&body=${encodeURIComponent(text + '\n\n(Invoice PDF attached)')}`, '_blank');
    toast('Your email app should open. Download the PDF first and attach it \u2014 browsers can\u2019t attach files to mailto links.');
    await markSent(inv, 'Email', to);
  } else {
    const ph = R.normPhone((c && (c.whatsapp || c.phone)) || inv.consigneeContact);
    window.open(`https://wa.me/${ph}?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
    await markSent(inv, 'WhatsApp', '+' + ph);
  }
  rerender();
};
ACT.invMarkSent = async el => { await markSent(byId('invoices', el.dataset.id), 'Manual', 'recorded by staff'); rerender(); };

/* ---------- Document slots ---------- */
function docSlot(inv, type, o) {
  const docs = activeDocs(inv, type).sort((a, b) => (b.uploadedAt || '').localeCompare(a.uploadedAt || ''));
  const cur = docs.find(d => d.active !== false);
  return `<div class="docslot"><div class="row between"><div><h4>${esc(R.DOC_TYPES[type])}${o.optional ? ' <span class="faint small">(optional)</span>' : ''}</h4><div class="small muted">${o.desc || ''}</div></div>
    ${cur ? '<span class="tag ok">Uploaded</span>' : '<span class="tag">Not uploaded</span>'}</div>
    ${docs.length ? `<ul class="doclist">${docs.map(d => `<li class="${d.active === false ? 'old' : ''}"><a href="${esc(fileUrl(d))}" target="_blank" rel="noopener">${esc(d.name)}</a><span class="muted small">${esc(userName(d.uploadedBy))} \u00b7 ${fmtDT(d.uploadedAt)}</span></li>`).join('')}</ul>` : ''}
    <div style="margin-top:10px">${o.can ? `<button class="btn sm primary" data-act="uploadDoc" data-id="${inv.id}" data-type="${type}">${cur ? 'Replace' : 'Upload'} ${esc(R.DOC_TYPES[type].toLowerCase())}</button>` : `<span class="small faint">${esc(o.why || 'You don\u2019t have permission to upload this.')}</span>`}</div></div>`;
}
ACT.uploadDoc = async el => {
  const type = el.dataset.type; let inv = byId('invoices', el.dataset.id);
  const files = await pickFiles(); if (!files.length) return;
  const [meta] = await svc.upload(files);
  for (const d of activeDocs(inv, type).filter(d => d.active !== false)) await svc.update('documents', d.id, { active: false });
  await svc.addDocument(meta, { invoiceId: inv.id, entity: 'invoice', entityId: inv.id, docType: type });
  await svc.audit('invoice', inv.id, 'Uploaded ' + R.DOC_TYPES[type], meta.name, inv.id);
  inv = byId('invoices', inv.id);
  if (type === 'payment_receipt' && inv.stage === 'sent') { await svc.setStage(inv, 'receipt_uploaded', { receiptAt: nowIso() }); toast('Payment receipt uploaded \u2014 sales can now upload the job card.', 'ok'); }
  else if (type === 'swift' && !inv.paymentConfirmed) {
    await svc.update('invoices', inv.id, { paymentConfirmed: true, paymentConfirmedAt: nowIso(), paymentConfirmedBy: App.me.id });
    await svc.audit('invoice', inv.id, 'Payment confirmed (SWIFT)', '', inv.id);
    await svc.notify(null, inv.invoiceNo + ': payment confirmed by finance.', inv.id, inv.salesUserId);
    if (inv.stage === 'sales_approved') await svc.notify('director.mark_sold', inv.invoiceNo + ': payment confirmed \u2014 ready to mark SOLD.', inv.id);
    toast('Payment confirmed.', 'ok');
  } else if (R.SHIPPING_DOCS.includes(type) && inv.stage === 'sold' && R.SHIPPING_DOCS.every(t => activeDocs(inv, t).some(d => d.active !== false))) {
    await svc.setStage(inv, 'completed', { shippedAt: nowIso() }, 'All shipping documents uploaded');
    const v = invoiceVehicle(inv); if (v) await svc.update('vehicles', v.id, { status: 'Shipped', shippedAt: nowIso() });
    toast('All shipping documents in \u2014 deal completed.', 'ok');
  } else toast(R.DOC_TYPES[type] + ' uploaded.', 'ok');
  rerender();
};

/* ---------- Tab: Payment ---------- */
function tabPayment(inv) {
  const staff = p => D('users').filter(u => u.active !== false && roleOf(u).permissions[p]);
  const canAssign = can('users.manage') || can('invoices.create');
  const sentYet = atLeast(inv, 'sent');
  return `<div class="stack">
    <div class="card"><div class="card-head"><div><h2>Payment</h2><p>The payment receipt moves the deal past \u201cInvoice sent\u201d. The SWIFT document confirms payment and is required before the vehicle can be marked SOLD.</p></div></div>
      <div class="row" style="margin-bottom:14px">
        ${field('Manager (payment receipt)', `<select id="asgMgr" ${canAssign ? '' : 'disabled'}><option value="">Unassigned</option>${staff('payments.upload_receipt').map(u => opt(u.id, u.name, inv.managerId)).join('')}</select>`)}
        ${field('Accountant (SWIFT)', `<select id="asgAcc" ${canAssign ? '' : 'disabled'}><option value="">Unassigned</option>${staff('payments.upload_swift').map(u => opt(u.id, u.name, inv.accountantId)).join('')}</select>`)}
        <div class="grow"></div><div class="right"><div class="muted small">Invoice total</div><b style="font-size:18px">${money(R.invoiceTotal(inv))}</b><div class="small muted">Deposit received ${money(inv.depositReceived)} \u2014 balance ${money(R.invoiceBalance(inv))}</div></div></div>
      <div class="grid g2">
        ${docSlot(inv, 'payment_receipt', { desc: 'Customer\u2019s transfer slip or bank receipt.', can: can('payments.upload_receipt') && sentYet, why: sentYet ? null : 'Send the invoice first.' })}
        ${docSlot(inv, 'swift', { desc: 'Bank SWIFT/MT103 confirming funds received.' + (inv.paymentConfirmed ? ' Confirmed ' + fmtDT(inv.paymentConfirmedAt) + ' by ' + esc(userName(inv.paymentConfirmedBy)) + '.' : ''), can: can('payments.upload_swift') && atLeast(inv, 'receipt_uploaded'), why: atLeast(inv, 'receipt_uploaded') ? null : 'Available once the payment receipt is uploaded.' })}
      </div></div>
    <div class="card">${docSlot(inv, 'vehicle_certificate', { optional: true, desc: 'Upload if a certificate is available \u2014 not every vehicle has one. Doesn\u2019t block any step.', can: canAny('invoices.create', 'operations.assign_stock', 'shipping.manage', 'payments.upload_receipt') })}</div></div>`;
}
document.addEventListener('change', async e => {
  if (e.target.id !== 'asgMgr' && e.target.id !== 'asgAcc') return;
  const inv = byId('invoices', App.route.id);
  const k = e.target.id === 'asgMgr' ? 'managerId' : 'accountantId';
  try { await svc.update('invoices', inv.id, { [k]: e.target.value || null }); await svc.audit('invoice', inv.id, 'Assigned ' + (k === 'managerId' ? 'manager' : 'accountant'), userName(e.target.value), inv.id);
    if (e.target.value) await svc.notify(null, inv.invoiceNo + ': you were assigned as ' + (k === 'managerId' ? 'manager (payment receipt)' : 'accountant (SWIFT)') + '.', inv.id, e.target.value);
    toast('Assignment saved.', 'ok'); } catch (err) { fail(err); }
});

/* ---------- Tab: Job card ---------- */
function tabJobCard(inv) {
  const jc = D('jobCards').find(j => j.invoiceId === inv.id);
  if (!atLeast(inv, 'receipt_uploaded') && !jc) return `<div class="card"><div class="empty"><h3>Job card unlocks after the payment receipt</h3><p>Once the customer\u2019s receipt is uploaded, sales uploads the job card describing how the customer wants the vehicle.</p></div></div>`;
  const editable = can('jobcards.create') && R.STAGE_INDEX[inv.stage] < R.STAGE_INDEX.qc_review;
  if (!jc || App.ui.jcEdit === inv.id) {
    if (!editable) return '<div class="card"><div class="empty"><h3>No job card yet</h3><p>Sales will upload it.</p></div></div>';
    return jobCardForm(inv, jc);
  }
  const accs = (jc.accessories || []).map(a => { const x = byId('accessories', a.accessoryId); return x ? `<tr><td><span class="code">${esc(x.code)}</span></td><td>${esc(x.label)}</td><td class="num">${a.qty}</td></tr>` : ''; }).join('');
  return `<div class="stack"><div class="card"><div class="card-head"><div><div class="row"><span class="code">${esc(jc.code)}</span>${jc.status === 'submitted' ? '<span class="tag ok">Submitted</span>' : '<span class="tag warn">Draft</span>'}${jc.priority === 'Urgent' ? '<span class="tag bad">Urgent</span>' : ''}</div>
      <p>By ${esc(userName(jc.createdBy))} on ${fmtDT(jc.createdAt)}${jc.targetDate ? ' \u2014 target dispatch ' + fmtDate(jc.targetDate) : ''}${jc.customerApproved ? ' \u2014 customer approved the look' : ''}</p></div>
      ${editable ? `<button class="btn" data-act="jcEdit" data-id="${inv.id}">${jc.status === 'submitted' ? 'Revise job card' : 'Continue editing'}</button>` : ''}</div>
      <div class="compare"><div><h3 style="margin-bottom:8px">Vehicle now</h3>${thumbs(jc.currentPhotos)}</div><div><h3 style="margin-bottom:8px">How the customer wants it</h3>${thumbs(jc.requiredPhotos)}</div></div>
      <div class="grid g2" style="margin-top:16px"><div><h3>Work requested</h3><div class="row" style="margin-top:6px">${(jc.workTypes || []).map(w => `<span class="tag brand">${esc(w)}</span>`).join('') || '<span class="faint small">None specified</span>'}</div>

      <h3 style="margin-top:16px">Detailed notes</h3><p style="white-space:pre-wrap;margin:6px 0 0">${esc(jc.notes || '\u2014')}</p></div></div>`;
}

function tabStock(inv) {

    return `<div class="card"><div class="card-head"><div><h2>Assigned vehicle</h2><p>Assigned by ${esc(userName(inv.stockAssignedBy))} on ${fmtDT(inv.stockAssignedAt)}. The readiness clock started then.</p></div>

  const eligible = D('vehicles').filter(x => (x.inventoryType === 'stock' || x.inventoryType === 'deposit') && (R.ASSIGNABLE_STATUSES.includes(x.status) || x.allocatedInvoiceId === inv.id) && (!x.allocatedInvoiceId || x.allocatedInvoiceId === inv.id));

function asPreview() {
  const el = $('#asPreview'); if (!el) return; const inv = byId('invoices', App.route.id);
  const sid = $('#asStock').value.trim(); if (!sid) { el.innerHTML = ''; return; }
  const v = vehicleByStock(sid);
  if (!v) { el.innerHTML = `<div class="notice bad">Stock <b>${esc(sid)}</b> isn\u2019t in Stock or Deposit inventory. ${can('stock.add') ? '<a href="#/stock" >Add the vehicle</a> first.' : 'Ask data entry to add it first.'}</div>`; return; }
  if (v.allocatedInvoiceId && v.allocatedInvoiceId !== inv.id) { const o = byId('invoices', v.allocatedInvoiceId); el.innerHTML = `<div class="notice bad">Stock ${esc(sid)} is already assigned to ${esc(o ? o.invoiceNo : 'another invoice')}.</div>`; return; }
  if (!R.ASSIGNABLE_STATUSES.includes(v.status) && v.allocatedInvoiceId !== inv.id) { el.innerHTML = `<div class="notice bad">Stock ${esc(sid)} is \u201c${esc(v.status)}\u201d and can\u2019t be assigned.</div>`; return; }

ACT.reassign = el => { App.ui.reassign = el.dataset.id; route(); setTimeout(asPreview); };
ACT.reassignCancel = () => { App.ui.reassign = null; route(); };
ACT.assignStock = async el => {
  let inv = byId('invoices', el.dataset.id);
  const sid = $('#asStock').value.trim(), chassis = $('#asChassis').value.trim();
  if (!sid || !chassis) throw new Error('Enter both the stock ID and the chassis number.');
  const v = vehicleByStock(sid);
  if (!v || !(v.inventoryType === 'stock' || v.inventoryType === 'deposit')) throw new Error('Stock ' + sid + ' isn\u2019t in Stock or Deposit inventory.');
  if (v.allocatedInvoiceId && v.allocatedInvoiceId !== inv.id) throw new Error('Stock ' + sid + ' is already assigned to another invoice.');
  if (!R.ASSIGNABLE_STATUSES.includes(v.status) && v.allocatedInvoiceId !== inv.id) throw new Error('Stock ' + sid + ' is ' + v.status + ' and can\u2019t be assigned.');
  const old = invoiceVehicle(inv);
  if (old && old.id !== v.id) await svc.update('vehicles', old.id, { status: 'Available', allocatedInvoiceId: null, customerId: null });
  await svc.update('vehicles', v.id, { status: 'Allocated', allocatedInvoiceId: inv.id, customerId: inv.customerId, chassisNo: chassis });
  const days = R.num(settings().readyDays) || 7;
  const patch = { stockId: String(sid), chassisNo: chassis, stockAssignedAt: nowIso(), stockAssignedBy: App.me.id, readyDueAt: new Date(Date.now() + days * 864e5).toISOString(), readyAt: null };
  try {
    if (inv.stage === 'job_card') await svc.setStage(inv, 'stock_assigned', patch, 'Stock ' + sid + ', chassis ' + chassis);
    else { await svc.update('invoices', inv.id, patch); await svc.audit('invoice', inv.id, 'Re-assigned stock', sid + ' / ' + chassis, inv.id); }
  } catch (e) { await svc.update('vehicles', v.id, { status: v.status, allocatedInvoiceId: v.allocatedInvoiceId || null, customerId: v.customerId || null }); throw e; }
  App.ui.reassign = null;
  toast('Stock ' + sid + ' assigned. Vehicle must be ready by ' + fmtDate(patch.readyDueAt) + '.', 'ok');
  rerender();
};

function tabShipping(inv) {
  if (!atLeast(inv, 'sold')) return '<div class="card"><div class="empty"><h3>Shipping opens once the vehicle is SOLD</h3><p>After the director marks it SOLD, the shipping team uploads the B/L, export and shipment documents.</p></div></div>';
  const s = inv.shipment || {}; const ed = can('shipping.manage');
  const f = (l, k, t) => field(l, `<input type="${t || 'text'}" name="${k}" value="${esc(s[k])}" ${ed ? '' : 'disabled'}>`);
  return `<div class="stack"><div class="card"><div class="card-head"><div><h2>Shipment details</h2><p>Visible to everyone on the deal.</p></div></div>
    <div class="form-grid" id="shipForm">${f('Shipment date', 'shipmentDate', 'date')}${f('Tracking / reference no.', 'trackingRef')}${f('Vessel / transport', 'transport')}${f('Destination port', 'destination')}
      ${field('Notes', `<textarea name="notes" ${ed ? '' : 'disabled'}>${esc(s.notes)}</textarea>`, 'full')}</div>
    ${ed ? `<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" data-act="saveShip" data-id="${inv.id}">Save shipment details</button></div>` : ''}</div>
    <div class="grid g3">${R.SHIPPING_DOCS.map(t => docSlot(inv, t, { can: ed, desc: t === 'bill_of_lading' ? 'Issued by the carrier.' : t === 'export_document' ? 'Customs export declaration.' : 'Packing list / shipping advice.' })).join('')}</div>
    ${inv.stage === 'completed' ? `<div class="notice ok">Shipped \u2014 all documents received ${fmtDT(inv.shippedAt)}.</div>` : '<div class="notice">The deal completes automatically once all three documents are uploaded.</div>'}</div>`;
}
ACT.saveShip = async el => { const inv = byId('invoices', el.dataset.id); await svc.update('invoices', inv.id, { shipment: formVals($('#shipForm')) }); await svc.audit('invoice', inv.id, 'Updated shipment details', '', inv.id); toast('Shipment details saved.', 'ok'); };

/* ---------- Tab: Costing ---------- */
function costSheetHtml(stockId, inv) {
  const c = costFor(stockId);
  const lines = [];
  c.workOrders.forEach(w => (w.lines || []).forEach(l => lines.push({ src: w.code, kind: l.kind, desc: (l.accessoryCode ? l.accessoryCode + ' ' : '') + l.description, qty: l.qty || 1, unit: l.unitPrice, total: R.num(l.qty || 1) * R.num(l.unitPrice) })));
  c.expenses.forEach(e => lines.push({ src: e.code, kind: 'other', desc: e.category + (e.description ? ' \u2014 ' + e.description : ''), qty: 1, unit: e.amount, total: R.num(e.amount) }));
  const kindLabel = { accessory: 'Accessory', part: 'Part', labour: 'Labour', other: 'Expense' };
  const pnl = inv ? dealFinancials(inv).pnl : null;
  return `<div class="grid g2"><div class="card flush"><div class="card-head" style="padding:16px 18px 0"><h2>Cost lines</h2>${can('accounts.expenses') ? `<button class="btn sm" data-act="newExpense" data-stock="${esc(stockId)}" data-inv="${inv ? inv.id : ''}">${svg('plus')}Add expense</button>` : ''}</div>
    <div class="table-wrap"><table class="t"><thead><tr><th>Source</th><th>Type</th><th>Description</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Total</th></tr></thead><tbody>
    <tr><td class="muted">Purchase</td><td><span class="tag">Vehicle</span></td><td>Buying price${c.vehicle && c.vehicle.inventoryType === 'deposit' ? ' (deposit inventory)' : ''}</td><td class="num">1</td><td class="num">${money(c.purchase)}</td><td class="num">${money(c.purchase)}</td></tr>
    ${lines.map(l => `<tr><td><span class="code">${esc(l.src)}</span></td><td><span class="tag ${l.kind === 'labour' ? 'info' : l.kind === 'other' ? 'warn' : 'brand'}">${kindLabel[l.kind] || 'Part'}</span></td><td>${esc(l.desc)}</td><td class="num">${l.qty}</td><td class="num">${money(l.unit)}</td><td class="num">${money(l.total)}</td></tr>`).join('')}
    </tbody><tfoot><tr><td colspan="5">Vehicle total cost</td><td class="num">${money(c.total)}</td></tr></tfoot></table></div></div>
    <div class="card"><h2 style="margin-bottom:10px">Summary</h2><table class="t"><tbody>
      <tr><td>Vehicle cost</td><td class="num">${money(c.purchase)}</td></tr><tr><td>Accessories</td><td class="num">${money(c.accessories)}</td></tr><tr><td>Parts</td><td class="num">${money(c.parts)}</td></tr>
      <tr><td>Labour charges</td><td class="num">${money(c.labour)}</td></tr><tr><td>Other expenses</td><td class="num">${money(c.other)}</td></tr>
      <tr><td><b>Vehicle total cost</b></td><td class="num"><b>${money(c.total)}</b></td></tr>
      ${pnl ? `<tr><td>Selling price (invoice)</td><td class="num">${money(pnl.selling)}</td></tr>
      <tr><td><b>Profit before commission</b></td><td class="num"><b class="${pnl.profitBefore < 0 ? 'money-neg' : ''}">${money(pnl.profitBefore)}</b></td></tr>
      <tr><td>Sales commission (${pnl.commissionPct}% of ${settings().commissionBasis === 'selling' ? 'selling price' : 'profit'}) \u2014 ${esc(userName(inv.salesUserId))}</td><td class="num">\u2212${money(pnl.commission)}</td></tr>
      <tr><td><b>Net profit</b></td><td class="num"><b class="${pnl.net < 0 ? 'money-neg' : 'money-pos'}">${money(pnl.net)}</b></td></tr>` : ''}
    </tbody></table>
    ${pnl && canAny('accounts.commissions', 'director.mark_sold') && !D('commissions').some(x => x.invoiceId === inv.id && x.status !== 'pending') ? `<div class="row" style="margin-top:12px"><button class="btn sm" data-act="editPct" data-id="${inv.id}">Change commission % for this deal</button></div>` : ''}
    </div></div>`;
}
function tabCosting(inv) {
  if (!canAny('stock.view_cost', 'accounts.view')) return '<div class="card"><div class="empty"><h3>Cost details are restricted</h3><p>Only finance, operations leads and directors can see vehicle costs.</p></div></div>';
  if (!inv.stockId) return '<div class="card"><div class="empty"><h3>No vehicle assigned yet</h3><p>Costing starts once Operations assigns a stock ID.</p></div></div>';
  return costSheetHtml(inv.stockId, inv);
}
ACT.editPct = el => {
  const inv = byId('invoices', el.dataset.id);
  modal({ title: 'Commission for ' + inv.invoiceNo, body: field('Commission % *', `<input type="number" name="pct" step="0.1" min="0" max="100" value="${commissionPctFor(inv)}"><span class="hint">Default for ${esc(userName(inv.salesUserId))} is ${esc((byId('users', inv.salesUserId) || {}).commissionPct || 0)}%.</span>`),
    foot: [{ label: 'Cancel' }, { label: 'Save', cls: 'primary', act: async m => { const p = R.num(formVals(m).pct); await svc.update('invoices', inv.id, { commissionPct: p }); const com = D('commissions').find(c => c.invoiceId === inv.id); if (com) await svc.update('commissions', com.id, { pct: p }); await svc.audit('invoice', inv.id, 'Commission set to ' + p + '%', '', inv.id); } }] });
};

/* ---------- Tab: Activity ---------- */
function tabActivity(inv) {
  const log = D('audit').filter(a => a.invoiceId === inv.id).slice().reverse();
  return `<div class="card"><h2 style="margin-bottom:8px">Activity & audit history</h2>${log.length ? `<ul class="feed">${log.map(a => `<li><div class="avatar sm">${esc(initials(a.userName))}</div><div><b>${esc(a.userName)}</b> ${esc(a.action)}${a.detail ? `<div class="small muted">${esc(a.detail)}</div>` : ''}</div><time>${fmtDT(a.at)}</time></li>`).join('')}</ul>` : '<span class="faint">No activity yet.</span>'}</div>`;
}

</script>
<script>
/* Horizon Vehicles ERP — inventory & workshop pages. */

/* ================= Stock & deposit inventory ================= */
function vehicleStatusTag(v) {
  const m = { Available: 'ok', 'On Hold': 'warn', Reserved: 'info', Allocated: 'brand', 'In Workshop': 'brand', Ready: 'ok', Sold: 'dark', Shipped: 'dark' };
  return `<span class="tag ${m[v.status] || ''}">${esc(v.status)}</span>`;
}
function inventoryPage(type) {
  if (!can('stock.view')) return denied('inventory');
  const isDep = type === 'deposit';
  const ui = App.ui.inv || (App.ui.inv = {});
  const locQ = qparam('loc'); if (locQ) ui.loc = locQ;
  const q = (ui.q || '').toLowerCase();
  const all = D('vehicles').filter(v => isDep ? v.inventoryType === 'deposit' : true);
  const list = all.filter(v => (!ui.loc || v.location === ui.loc) && (!ui.status || v.status === ui.status) && (isDep || !ui.type || v.inventoryType === ui.type)
    && (!q || [v.stockId, v.chassisNo, v.make, v.model, v.year, v.color].join(' ').toLowerCase().includes(q)))
    .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  const cost = can('stock.view_cost');
  const locs = settings().stockLocations || [];
  const depKpis = isDep ? `<div class="grid g3 section"><div class="kpi"><div class="label">Deposit vehicles</div><div class="value">${all.length}</div></div>
    ${cost ? `<div class="kpi"><div class="label">Deposit paid</div><div class="value">${money(all.reduce((s, v) => s + R.num(v.depositAmount), 0))}</div></div>
    <div class="kpi"><div class="label">Remaining owed</div><div class="value">${money(all.reduce((s, v) => s + R.num(v.buyingPrice) - R.num(v.depositAmount), 0))}</div></div>` : ''}</div>` : '';
  return `<div class="page-head"><div><h1>${isDep ? 'Deposit inventory' : 'Stock inventory'}</h1><p>${isDep ? 'Vehicles still being paid for. They can be assigned to an invoice like stock vehicles.' : all.length + ' vehicles across stock and deposit inventory. Only vehicles listed here can be assigned to invoices.'}</p></div>
    ${can('stock.add') ? `<button class="btn primary" data-act="newVehicle" data-type="${type}">${svg('plus')}Add vehicle</button>` : ''}</div>${depKpis}
    <div class="toolbar"><input type="search" id="invQ" placeholder="Stock ID, chassis, make, model" value="${esc(ui.q || '')}">
      <select id="invLoc"><option value="">All locations</option>${locs.map(l => opt(l, l, ui.loc)).join('')}</select>
      <select id="invStatus"><option value="">All statuses</option>${R.VEHICLE_STATUSES.map(s => opt(s, s, ui.status)).join('')}</select>
      ${isDep ? '' : `<select id="invType"><option value="">Stock + deposit</option>${opt('stock', 'Stock only', ui.type)}${opt('deposit', 'Deposit only', ui.type)}</select>`}
      <span class="muted small">${list.length} shown</span></div>
    <div class="card flush"><div class="table-wrap"><table class="t"><thead><tr><th></th><th>Stock ID</th><th>Vehicle</th><th>Location</th><th>Chassis</th>${cost ? '<th class="num">Buying</th>' : ''}<th class="num">Selling</th>${isDep && cost ? '<th class="num">Deposit paid</th><th class="num">Remaining</th>' : ''}<th>Status</th><th>Invoice</th></tr></thead><tbody>
    ${list.slice(0, 500).map(v => { const inv = v.allocatedInvoiceId ? byId('invoices', v.allocatedInvoiceId) : null; return `<tr class="click" onclick="go('#/vehicle/${v.id}')"><td>${vehImg(v)}</td><td>${plate(v.stockId)}${v.inventoryType === 'deposit' && !isDep ? '<div class="small muted">deposit</div>' : ''}</td>
      <td><b>${esc(v.year + ' ' + v.make + ' ' + v.model)}</b><div class="small muted">${esc([v.bodyType, v.color, v.transmission, v.mileage].filter(Boolean).join(' \u00b7 '))}</div></td><td>${esc(v.location)}</td><td class="small">${esc(v.chassisNo || '\u2014')}</td>
      ${cost ? `<td class="num">${money(v.buyingPrice)}</td>` : ''}<td class="num">${money(v.sellingPrice)}</td>${isDep && cost ? `<td class="num">${money(v.depositAmount)}</td><td class="num">${money(R.num(v.buyingPrice) - R.num(v.depositAmount))}</td>` : ''}
      <td>${vehicleStatusTag(v)}</td><td>${inv ? `<span class="code">${esc(inv.invoiceNo)}</span>` : ''}</td></tr>`; }).join('') || `<tr><td colspan="12"><div class="empty"><h3>No vehicles match</h3><p>${can('stock.add') ? 'Add a vehicle to make it assignable.' : 'Try clearing the filters.'}</p></div></td></tr>`}
    </tbody></table></div></div>${list.length > 500 ? '<p class="small muted">Showing the first 500 \u2014 narrow the filters to see more.</p>' : ''}`;
}
function mountInventory() {
  const ui = App.ui.inv;
  const q = $('#invQ'); if (q) q.oninput = () => { ui.q = q.value; const p = q.selectionStart; route(); const n = $('#invQ'); n.focus(); n.setSelectionRange(p, p); };
  [['invLoc', 'loc'], ['invStatus', 'status'], ['invType', 'type']].forEach(([id, k]) => { const el = $('#' + id); if (el) el.onchange = () => { ui[k] = el.value; if (location.hash.includes('?')) location.hash = location.hash.split('?')[0]; else route(); }; });
}
App.pages.stock = { render: () => inventoryPage('stock'), mount: mountInventory };
App.pages.deposit = { render: () => inventoryPage('deposit'), mount: mountInventory };

function vehicleForm(v, type) {
  v = v || { inventoryType: type === 'deposit' ? 'deposit' : 'stock', location: 'Thailand', steering: 'Right', fuel: 'Diesel', transmission: 'Automatic', status: 'Available' };
  const i = (l, k, t, extra) => field(l, `<input type="${t || 'text'}" name="${k}" value="${esc(v[k])}" ${extra || ''}>`);
  const s = (l, k, opts) => field(l, `<select name="${k}">${opts.map(o => opt(o, o, v[k])).join('')}</select>`);
  const cost = can('stock.view_cost');
  return `<div class="form-grid">
    ${field('Inventory *', `<select name="inventoryType">${opt('stock', 'Stock inventory', v.inventoryType)}${opt('deposit', 'Deposit inventory (still paying)', v.inventoryType)}</select>`)}
    ${i('Stock ID *', 'stockId', 'text', v.id ? 'disabled' : 'placeholder="Unique, e.g. 2371"')}
    ${i('Chassis no.', 'chassisNo')}${s('Location *', 'location', settings().stockLocations || ['Thailand'])}
    ${i('Make *', 'make')}${i('Model *', 'model')}${i('Year *', 'year', 'number')}${i('Body type', 'bodyType')}${i('Color', 'color')}
    ${s('Fuel', 'fuel', ['Diesel', 'Petrol', 'Hybrid Petrol', 'Electric'])}${s('Transmission', 'transmission', ['Automatic', 'Manual'])}${i('Engine', 'engine')}
    ${i('Mileage', 'mileage')}${s('Drive', 'drive', ['2WD', '4WD', 'AWD'])}${s('Steering', 'steering', ['Right', 'Left'])}
    ${cost ? i('Buying price (USD) *', 'buyingPrice', 'number') : ''}${i('Selling price (USD)', 'sellingPrice', 'number')}
    <div class="dep-only full"><div class="form-grid">${cost ? i('Deposit paid (USD)', 'depositAmount', 'number') : ''}${i('Supplier / seller', 'supplier')}</div></div>
    ${field('Notes', `<textarea name="notes">${esc(v.notes)}</textarea>`, 'full')}
    <div class="full"><h3 style="margin-bottom:6px">Photos</h3><div id="vehPh"></div><div class="dropzone" style="margin-top:8px" data-act="vehPhAdd">Add vehicle photos</div></div></div>`;
}
function vehPhRefresh() { const el = $('#vehPh'); if (el) el.innerHTML = thumbs(App.ui.vehPhotos, 'vehPhDel'); }
ACT.vehPhAdd = async () => { const f = await pickFiles({ accept: 'image/*', multiple: true }); if (!f.length) return; App.ui.vehPhotos.push(...await svc.upload(f)); vehPhRefresh(); };
ACT.vehPhDel = el => { App.ui.vehPhotos.splice(+el.dataset.i, 1); vehPhRefresh(); };
function openVehicleModal(v, type) {
  App.ui.vehPhotos = v ? (v.images || []).slice() : [];
  modal({ title: v ? 'Edit stock ' + v.stockId : 'Add vehicle', wide: true, body: vehicleForm(v, type),
    onOpen: m => { const t = $('[name=inventoryType]', m); const sync = () => $('.dep-only', m).style.display = t.value === 'deposit' ? '' : 'none'; t.onchange = sync; sync(); vehPhRefresh(); },
    foot: [{ label: 'Cancel' }, { label: v ? 'Save changes' : 'Add vehicle', cls: 'primary', act: async m => {
      need(m, v ? ['make', 'model', 'year'] : ['stockId', 'make', 'model', 'year'].concat(can('stock.view_cost') ? ['buyingPrice'] : []));
      const d = formVals(m); d.images = App.ui.vehPhotos;
      if (v) { delete d.stockId; await svc.update('vehicles', v.id, d); await svc.audit('vehicle', v.id, 'Edited stock ' + v.stockId); }
      else {
        d.stockId = String(d.stockId).trim();
        if (vehicleByStock(d.stockId)) throw new Error('Stock ID ' + d.stockId + ' already exists.');
        const rec = await svc.insert('vehicles', Object.assign(d, { status: 'Available', allocatedInvoiceId: null, yardStatus: 'In Yard', addedBy: App.me.name }));
        await svc.audit('vehicle', rec.id, 'Added stock ' + rec.stockId + ' to ' + rec.inventoryType + ' inventory', rec.year + ' ' + rec.make + ' ' + rec.model);
        toast('Stock ' + rec.stockId + ' added.', 'ok');
      }
    } }] });
}
ACT.newVehicle = el => openVehicleModal(null, el.dataset.type);
ACT.editVehicle = el => openVehicleModal(byId('vehicles', el.dataset.id));
ACT.vehStatus = async el => {
  const v = byId('vehicles', el.dataset.id); const s = $('#vehStatusSel').value;
  await svc.update('vehicles', v.id, { status: s }); await svc.audit('vehicle', v.id, 'Stock ' + v.stockId + ' status \u2192 ' + s); toast('Status updated.', 'ok'); route();
};

App.pages.vehicle = {
  render(r) {
    if (!can('stock.view')) return denied('inventory');
    const v = byId('vehicles', r.id); if (!v) return '<div class="empty"><h3>Vehicle not found</h3></div>';
    const inv = v.allocatedInvoiceId ? byId('invoices', v.allocatedInvoiceId) : null;
    const locked = !!v.allocatedInvoiceId || ['Sold', 'Shipped'].includes(v.status);
    const log = D('audit').filter(a => a.entityId === v.id).slice(-10).reverse();
    return `<div class="crumbs"><a href="#/${v.inventoryType === 'deposit' ? 'deposit' : 'stock'}">${v.inventoryType === 'deposit' ? 'Deposit' : 'Stock'} inventory</a> / ${esc(v.stockId)}</div>
    <div class="page-head"><div><div class="row"><span class="plate lg">${esc(v.stockId)}</span><h1>${esc(v.year + ' ' + v.make + ' ' + v.model)}</h1>${vehicleStatusTag(v)}</div>
      <p>${esc([v.bodyType, v.color, v.fuel, v.engine, v.transmission, v.drive, v.mileage, v.steering ? v.steering + '-hand drive' : ''].filter(Boolean).join(' \u00b7 '))} \u2014 ${esc(v.location)} \u2014 chassis ${esc(v.chassisNo || 'not recorded')}</p></div>
      <div class="row">${can('stock.edit') ? `<button class="btn" data-act="editVehicle" data-id="${v.id}">Edit</button>` : ''}</div></div>
    <div class="grid" style="grid-template-columns:minmax(0,2fr) minmax(260px,1fr)"><div class="stack">
      <div class="card"><h2 style="margin-bottom:10px">Photos</h2>${thumbs(v.images)}</div>
      ${canAny('stock.view_cost', 'accounts.view') ? `<div><h2 style="margin:8px 0 10px">Cost sheet</h2>${costSheetHtml(v.stockId, inv && atLeast(inv, 'stock_assigned') ? inv : null)}</div>` : ''}
    </div><div class="stack">
      <div class="card"><h2 style="margin-bottom:8px">Allocation</h2>${inv ? `<p style="margin:0">Assigned to <a href="#/deals/${inv.id}"><span class="code">${esc(inv.invoiceNo)}</span></a> for ${esc((customer(inv.customerId) || {}).name || '')}.</p><div style="margin-top:8px">${stageTag(inv)} ${slaBadge(inv)}</div>` : '<p class="muted" style="margin:0">Not assigned to any invoice.</p>'}
        ${can('stock.edit') && !locked ? `<div class="row" style="margin-top:12px"><select id="vehStatusSel" style="width:auto">${R.ASSIGNABLE_STATUSES.map(s => opt(s, s, v.status)).join('')}</select><button class="btn sm" data-act="vehStatus" data-id="${v.id}">Update status</button></div>` : ''}</div>
      <div class="card"><h2 style="margin-bottom:8px">Details</h2><table class="t"><tbody>
        <tr><td class="muted">Inventory</td><td>${v.inventoryType === 'deposit' ? 'Deposit' : 'Stock'}</td></tr>
        ${can('stock.view_cost') ? `<tr><td class="muted">Buying</td><td>${money(v.buyingPrice)}</td></tr>` : ''}<tr><td class="muted">Selling</td><td>${money(v.sellingPrice)}</td></tr>
        ${v.inventoryType === 'deposit' && can('stock.view_cost') ? `<tr><td class="muted">Deposit paid</td><td>${money(v.depositAmount)}</td></tr><tr><td class="muted">Remaining</td><td>${money(R.num(v.buyingPrice) - R.num(v.depositAmount))}</td></tr>` : ''}
        <tr><td class="muted">Supplier</td><td>${esc(v.supplier || '\u2014')}</td></tr><tr><td class="muted">Added by</td><td>${esc(v.addedBy || userName(v.createdBy))}</td></tr></tbody></table>
        ${v.notes ? `<p class="small muted" style="white-space:pre-wrap">${esc(v.notes)}</p>` : ''}</div>
      <div class="card"><h2 style="margin-bottom:6px">History</h2>${log.length ? `<ul class="feed">${log.map(a => `<li><div>${esc(a.userName)} ${esc(a.action)}</div><time>${rel(a.at)}</time></li>`).join('')}</ul>` : '<span class="faint small">No changes recorded.</span>'}</div>
    </div></div>`;
  },
};

/* ================= Accessories stock ================= */
App.pages.accessories = {
  render() {
    if (!can('accessories.view')) return denied('accessories');
    const tab = App.ui.accTab || 'items';
    const list = D('accessories').slice().sort((a, b) => a.code.localeCompare(b.code));
    const mg = can('accessories.manage');
    const low = list.filter(a => R.num(a.qty) <= R.num(a.reorderLevel));
    const items = `<div class="card flush"><div class="table-wrap"><table class="t"><thead><tr><th>Accessory ID</th><th>Label</th><th>Category</th><th class="num">Unit price</th><th class="num">In stock</th><th class="num">Reorder at</th><th class="num">Stock value</th><th></th></tr></thead><tbody>
      ${list.map(a => `<tr><td><span class="code">${esc(a.code)}</span></td><td><b>${esc(a.label)}</b>${a.supplier ? `<div class="small muted">${esc(a.supplier)}</div>` : ''}</td><td>${esc(a.category)}</td><td class="num">${money(a.unitPrice)}</td>
        <td class="num">${R.num(a.qty) <= R.num(a.reorderLevel) ? `<span class="tag warn">${a.qty}</span>` : a.qty}</td><td class="num">${a.reorderLevel}</td><td class="num">${money(R.num(a.qty) * R.num(a.unitPrice))}</td>
        <td class="right nowrap">${mg ? `<button class="btn sm" data-act="accAdjust" data-id="${a.id}">Adjust stock</button> <button class="btn sm" data-act="accEdit" data-id="${a.id}">Edit</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="8"><div class="empty"><h3>No accessories yet</h3></div></td></tr>'}
      </tbody></table></div></div>`;
    const moves = D('stockMoves').slice().reverse();
    const movesHtml = `<div class="card flush"><div class="table-wrap"><table class="t"><thead><tr><th>When</th><th>Accessory</th><th class="num">Change</th><th>Reason</th><th>By</th></tr></thead><tbody>

    return `<div class="page-head"><div><h1>Accessories stock</h1><p>Every accessory gets a unique ID. When a mechanic enters an ID on a bill, the label and price fill in automatically and stock is deducted when the job completes.</p></div>

    ${field('Reorder level', `<input type="number" name="reorderLevel" value="${esc(a ? a.reorderLevel : 2)}">`)}${field('Supplier', `<input type="text" name="supplier" value="${esc(a && a.supplier)}">`)}</div>`,

ACT.accAdjust = el => {

    foot: [{ label: 'Cancel' }, { label: 'Save adjustment', cls: 'primary', act: async m => {

      await svc.audit('accessory', a.id, 'Adjusted ' + a.code + ' by ' + v.qty, v.reason);

/* ================= Workshop ================= */
App.pages.workshop = {
  render(r) {
    if (!canAny('mechanics.manage', 'mechanic.bill', 'operations.send_mechanic')) return denied('the workshop');
    if (r.id && App.ui.woAuto !== r.id) { App.ui.woAuto = r.id; setTimeout(() => { const w = byId('workOrders', r.id); if (w) openWOModal(w); }); }
    const mm = myMechanic(); const all = can('mechanics.manage') || can('operations.send_mechanic');
    const tab = App.ui.wsTab || 'orders';
    const st = App.ui.wsStatus || 'open';
    const wos = D('workOrders').filter(w => all || (mm && w.mechanicId === mm.id))
      .filter(w => st === 'all' || (st === 'open' ? ['assigned', 'in_progress'].includes(w.status) : w.status === st)).slice().reverse();
    const orders = `<div class="toolbar"><div class="seg">${[['open', 'Open'], ['completed', 'Completed'], ['all', 'All']].map(([k, l]) => `<button class="${st === k ? 'on' : ''}" data-act="wsStatus" data-s="${k}">${l}</button>`).join('')}</div></div>
      <div class="stack">${wos.map(w => woCard(w, true)).join('') || `<div class="card"><div class="empty"><h3>No ${st === 'all' ? '' : st} work orders</h3><p>${all ? 'Work orders are created from a deal\u2019s Workshop tab after stock is assigned.' : mm ? 'New jobs assigned to you will appear here.' : 'Your user isn\u2019t linked to a mechanic profile yet \u2014 ask an admin.'}</p></div></div>`}</div>`;
    const mechs = `<div class="card flush"><div class="table-wrap"><table class="t"><thead><tr><th>ID</th><th>Name</th><th>Specialty</th><th>Workshop</th><th>Phone</th><th>Login</th><th class="num">Open jobs</th><th class="num">Billed total</th><th></th></tr></thead><tbody>
      ${D('mechanics').map(m => { const ws = D('workOrders').filter(w => w.mechanicId === m.id); return `<tr><td><span class="code">${esc(m.code)}</span></td><td><b>${esc(m.name)}</b> ${m.active === false ? '<span class="tag">Inactive</span>' : ''}</td><td>${esc(m.specialty)}</td><td>${esc(m.workshop)}</td><td>${esc(m.phone)}</td><td>${m.userId ? esc(userName(m.userId)) : '<span class="faint">No login</span>'}</td>
        <td class="num">${ws.filter(w => w.status !== 'completed').length}</td><td class="num">${money(ws.reduce((s, w) => s + (w.lines || []).reduce((t, l) => t + R.num(l.qty || 1) * R.num(l.unitPrice), 0), 0))}</td><td class="right">${can('mechanics.manage') ? `<button class="btn sm" data-act="mechEdit" data-id="${m.id}">Edit</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div></div>`;
    return `<div class="page-head"><div><h1>Workshop</h1><p>${all ? 'All mechanic work orders and the mechanic roster.' : 'Your work orders. Enter what you used and your labour, and attach the bill.'}</p></div>
      ${can('mechanics.manage') && tab === 'mechanics' ? `<button class="btn primary" data-act="mechEdit">${svg('plus')}Add mechanic</button>` : ''}</div>
      ${all ? `<nav class="tabs"><a href="#" data-act="wsTab" data-t="orders" class="${tab === 'orders' ? 'on' : ''}">Work orders</a><a href="#" data-act="wsTab" data-t="mechanics" class="${tab === 'mechanics' ? 'on' : ''}">Mechanics</a></nav>` : ''}
      ${tab === 'mechanics' && all ? mechs : orders}`;

};
ACT.wsTab = el => { App.ui.wsTab = el.dataset.t; route(); };
ACT.wsStatus = el => { App.ui.wsStatus = el.dataset.s; route(); };
ACT.mechEdit = el => {
  const m0 = el.dataset.id ? byId('mechanics', el.dataset.id) : null;
  const mechUsers = D('users').filter(u => roleOf(u).permissions['mechanic.bill']);
  modal({ title: m0 ? 'Edit ' + m0.code : 'Add mechanic', body: `<div class="form-grid">
    ${field('Name *', `<input type="text" name="name" value="${esc(m0 && m0.name)}">`)}${field('Phone', `<input type="tel" name="phone" value="${esc(m0 && m0.phone)}">`)}
    ${field('Specialty *', `<input type="text" name="specialty" value="${esc(m0 && m0.specialty)}" placeholder="Paint, denting, engine\u2026">`)}${field('Workshop', `<input type="text" name="workshop" value="${esc(m0 && m0.workshop)}">`)}
    ${field('Linked login <em>(lets them enter their own bills)</em>', `<select name="userId"><option value="">No login \u2014 Operations enters bills</option>${mechUsers.map(u => opt(u.id, u.name, m0 && m0.userId)).join('')}</select>`)}
    <label class="check" style="align-self:end"><input type="checkbox" name="active" ${!m0 || m0.active !== false ? 'checked' : ''}>Active</label></div>`,
    foot: [{ label: 'Cancel' }, { label: 'Save', cls: 'primary', act: async m => { need(m, ['name', 'specialty']); const v = formVals(m); v.userId = v.userId || null;
      if (m0) await svc.update('mechanics', m0.id, v); else { const r = await svc.insert('mechanics', v); toast(r.code + ' added.', 'ok'); } } }] });
};

/* ---------- Work order: bill entry ---------- */
ACT.openWO = el => openWOModal(byId('workOrders', el.dataset.id));
function openWOModal(w) {
  const edit = canBillWO(w) && w.status !== 'completed';
  const inv = byId('invoices', w.invoiceId); const v = vehicleByStock(w.stockId); const jc = D('jobCards').find(j => j.invoiceId === w.invoiceId);
  const lines = JSON.parse(JSON.stringify(w.lines || []));
  const accs = D('accessories');
  const billDocs = () => D('documents').filter(d => d.entity === 'workOrder' && d.entityId === w.id && d.active !== false);
  let drawing = false;
  const draw = m => {
    if (drawing) return; drawing = true;
    try { drawInner(m); } finally { drawing = false; }
  };
  const drawInner = m => {
    const tot = lines.reduce((s, l) => s + R.num(l.qty || 1) * R.num(l.unitPrice), 0);
    $('#woLines', m).innerHTML = `<table class="t"><thead><tr><th style="width:130px">Type</th><th style="width:130px">Accessory ID</th><th>Item / description</th><th style="width:80px" class="num">Qty</th><th style="width:120px" class="num">Price (USD)</th><th class="num" style="width:100px">Total</th>${edit ? '<th></th>' : ''}</tr></thead><tbody>
      ${lines.map((l, i) => edit ? `<tr><td><select data-l="${i}" data-k="kind">${opt('accessory', 'Accessory (stock)', l.kind)}${opt('part', 'Part / product', l.kind)}${opt('labour', 'Labour', l.kind)}</select></td>
        <td>${l.kind === 'accessory' ? `<input type="text" list="woAccList" data-l="${i}" data-k="accessoryCode" value="${esc(l.accessoryCode)}" placeholder="ACC-0001">` : '<span class="faint">\u2014</span>'}</td>
        <td><input type="text" data-l="${i}" data-k="description" value="${esc(l.description)}" ${l.kind === 'accessory' ? 'readonly' : ''} placeholder="${l.kind === 'labour' ? 'e.g. Denting labour' : 'e.g. Steering cover'}"></td>
        <td><input type="number" min="1" data-l="${i}" data-k="qty" value="${esc(l.qty || 1)}"></td><td><input type="number" data-l="${i}" data-k="unitPrice" value="${esc(l.unitPrice)}" ${l.kind === 'accessory' ? 'readonly' : ''}></td>
        <td class="num">${money(R.num(l.qty || 1) * R.num(l.unitPrice))}</td><td><button class="btn sm danger" data-rm="${i}">\u2715</button></td></tr>`
      : `<tr><td>${esc(l.kind)}</td><td>${esc(l.accessoryCode || '')}</td><td>${esc(l.description)}</td><td class="num">${l.qty || 1}</td><td class="num">${money(l.unitPrice)}</td><td class="num">${money(R.num(l.qty || 1) * R.num(l.unitPrice))}</td></tr>`).join('') || `<tr><td colspan="7" class="faint">No items yet.</td></tr>`}
      </tbody><tfoot><tr><td colspan="5">Total billed</td><td class="num">${money(tot)}</td>${edit ? '<td></td>' : ''}</tr></tfoot></table>`;
    $('#woBills', m).innerHTML = thumbs(billDocs().map(d => d), null);
  };
  const body = `<div class="grid g2" style="margin-bottom:14px"><div>${v ? vehicleCard(v) : plate(w.stockId)}</div>
      <div class="small"><b>${esc(w.workType)}</b> \u2014 ${esc((byId('mechanics', w.mechanicId) || {}).name || '')}<br>${w.instructions ? `<span style="white-space:pre-wrap">${esc(w.instructions)}</span>` : ''}${jc && (jc.requiredPhotos || []).length ? `<div style="margin-top:8px">Required look:</div>${thumbs(jc.requiredPhotos)}` : ''}</div></div>
    <h3 style="margin-bottom:6px">Items & labour</h3><div class="table-wrap" id="woLines"></div>
    <datalist id="woAccList">${accs.map(a => `<option value="${esc(a.code)}">${esc(a.label + ' \u2014 ' + money(a.unitPrice) + ' \u2014 ' + a.qty + ' in stock')}</option>`).join('')}</datalist>
    ${edit ? `<div class="row" style="margin-top:8px"><button class="btn sm" data-add="accessory">Add accessory from stock</button><button class="btn sm" data-add="part">Add part / product</button><button class="btn sm" data-add="labour">Add labour charge</button></div>` : ''}
    <h3 style="margin:16px 0 6px">Bills attached <span class="faint small">(required \u2014 photo or PDF of every bill)</span></h3><div id="woBills"></div>
    ${edit ? '<div class="dropzone" style="margin-top:8px" id="woBillAdd">Attach bill photo or PDF</div>' : ''}
    ${w.status === 'completed' ? `<div class="notice ok" style="margin-top:12px">Completed ${fmtDT(w.completedAt)}.</div>` : ''}`;
  const foot = [{ label: 'Close' }];
  if (edit) {
    if (w.status === 'assigned') foot.push({ label: 'Save & start job', act: async () => { await saveLines('in_progress'); } });
    else foot.push({ label: 'Save', act: async () => { await saveLines(); } });
    foot.push({ label: 'Mark job complete', cls: 'ok', act: async () => { await completeWO(); } });
  }
  async function saveLines(status) {
    for (const l of lines) if (!l.description || R.num(l.unitPrice) < 0) throw new Error('Every line needs an item/description and a price.');
    await svc.update('workOrders', w.id, Object.assign({ lines }, status ? { status, startedAt: nowIso() } : {}));
    await svc.audit('invoice', w.invoiceId, 'Updated bill on ' + w.code, lines.length + ' line(s)', w.invoiceId);
  }
  async function completeWO() {
    if (!lines.length) throw new Error('Add at least one item or labour line before completing.');
    if (!billDocs().length) throw new Error('Attach the bill before completing \u2014 every cost needs a document.');
    for (const l of lines.filter(l => l.kind === 'accessory')) { const a = byId('accessories', l.accessoryId); if (!a) throw new Error('Unknown accessory ' + l.accessoryCode + '.'); if (R.num(a.qty) < R.num(l.qty || 1)) throw new Error(a.code + ' ' + a.label + ': only ' + a.qty + ' in stock.'); }
    await saveLines();
    for (const l of lines.filter(l => l.kind === 'accessory')) {
      const a = byId('accessories', l.accessoryId);
      await svc.update('accessories', a.id, { qty: R.num(a.qty) - R.num(l.qty || 1) });
      await svc.insert('stockMoves', { accessoryId: a.id, qty: -R.num(l.qty || 1), reason: 'Used on ' + w.code + ' (stock ' + w.stockId + ')', at: nowIso(), workOrderId: w.id });
    }
    await svc.update('workOrders', w.id, { status: 'completed', completedAt: nowIso() });
    await svc.audit('invoice', w.invoiceId, 'Completed ' + w.code, money(lines.reduce((s, l) => s + R.num(l.qty || 1) * R.num(l.unitPrice), 0)), w.invoiceId);
    if (D('workOrders').filter(x => x.invoiceId === w.invoiceId).every(x => x.status === 'completed')) await svc.notify('operations.qc_submit', (inv ? inv.invoiceNo : 'Stock ' + w.stockId) + ': all workshop jobs done \u2014 submit the final look.', w.invoiceId);
    toast(w.code + ' completed.', 'ok');
  }
  modal({ title: 'Work order ' + w.code, sub: 'Stock ' + esc(w.stockId) + (inv && can('invoices.view') ? ' \u2014 ' + esc(inv.invoiceNo) : ''), wide: true, body, foot,
    onOpen: m => {
      draw(m);
      m.addEventListener('click', async e => {
        const add = e.target.closest('[data-add]'); if (add) { lines.push({ kind: add.dataset.add, qty: 1, unitPrice: '', description: '' }); draw(m); return; }
        const rm = e.target.closest('[data-rm]'); if (rm) { lines.splice(+rm.dataset.rm, 1); draw(m); return; }
        if (e.target.id === 'woBillAdd') {
          try { const f = await pickFiles({ multiple: true }); if (!f.length) return; for (const meta of await svc.upload(f)) await svc.addDocument(meta, { entity: 'workOrder', entityId: w.id, invoiceId: w.invoiceId, docType: 'mechanic_bill' }); draw(m); toast('Bill attached.', 'ok'); } catch (err) { fail(err); }
        }
      });
      m.addEventListener('change', e => {
        const t = e.target; if (t.dataset.l == null) return; const l = lines[+t.dataset.l];
        l[t.dataset.k] = t.type === 'number' ? t.value : t.value;
        if (t.dataset.k === 'kind') { l.accessoryId = null; l.accessoryCode = ''; if (l.kind === 'accessory') { l.description = ''; l.unitPrice = ''; } }
        if (t.dataset.k === 'accessoryCode') {
          const a = accs.find(x => x.code.toLowerCase() === t.value.trim().toLowerCase());
          if (a) { l.accessoryId = a.id; l.accessoryCode = a.code; l.description = a.label; l.unitPrice = a.unitPrice; }
          else { l.accessoryId = null; l.description = ''; l.unitPrice = ''; toast('No accessory with ID ' + t.value + '.', 'bad'); }
        }
        draw(m);
      });
    } });
}

</script>
<script>
/* Horizon Vehicles ERP — finance & administration pages. */

/* ================= Expenses (bill always required) ================= */
ACT.newExpense = el => {
  let bill = null;
  const stock = el.dataset.stock || '';
  modal({ title: 'Record vehicle expense', sub: 'Every cost needs its bill attached.', body: `<div class="form-grid">
    ${field('Stock ID *', `<input type="text" name="stockId" value="${esc(stock)}" list="expStock"><datalist id="expStock">${D('vehicles').map(v => `<option value="${esc(v.stockId)}">`).join('')}</datalist>`)}
    ${field('Category *', `<select name="category">${R.EXPENSE_CATEGORIES.map(c => opt(c, c)).join('')}</select>`)}
    ${field('Amount (USD) *', '<input type="number" name="amount" step="0.01">')}${field('Date', `<input type="date" name="date" value="${new Date().toISOString().slice(0, 10)}">`)}
    ${field('Description', '<input type="text" name="description">', 'full')}
    <div class="full"><div id="expBill" class="small faint">No bill attached.</div><div class="dropzone" style="margin-top:6px" id="expBillBtn">Attach bill (photo or PDF) *</div></div></div>`,
    onOpen: m => { $('#expBillBtn', m).onclick = async () => { try { const f = await pickFiles(); if (!f.length) return; [bill] = await svc.upload(f); $('#expBill', m).innerHTML = thumbs([bill]); } catch (e) { fail(e); } }; },
    foot: [{ label: 'Cancel' }, { label: 'Save expense', cls: 'primary', act: async m => {
      need(m, ['stockId', 'amount']); const v = formVals(m);
      if (!vehicleByStock(v.stockId)) throw new Error('Stock ' + v.stockId + ' isn\u2019t in inventory.');
      if (!bill) throw new Error('Attach the bill before saving.');
      const veh = vehicleByStock(v.stockId);
      const inv = veh.allocatedInvoiceId || el.dataset.inv || null;
      const exp = await svc.insert('expenses', Object.assign(v, { stockId: String(v.stockId), invoiceId: inv, amount: R.num(v.amount) }));
      await svc.addDocument(bill, { entity: 'expense', entityId: exp.id, invoiceId: inv, docType: 'expense_bill' });
      await svc.update('expenses', exp.id, { billFileId: bill.fileId, billName: bill.name });
      await svc.audit('vehicle', veh.id, 'Recorded expense ' + exp.code + ' on stock ' + v.stockId, v.category + ' ' + money(v.amount), inv);
      toast(exp.code + ' recorded.', 'ok');
    } }] });
};

/* ================= Company accounts ================= */
function commissionAmount(com) {
  if (com.status !== 'pending' && com.lockedAmount != null) return { amount: com.lockedAmount, base: com.lockedBase };
  const inv = byId('invoices', com.invoiceId); if (!inv) return { amount: 0, base: 0 };
  const { pnl } = dealFinancials(inv); return { amount: pnl.commission, base: pnl.commissionBase };
}
function csvDownload(name, rows) {
  const csv = rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = name; a.click();
}
function soldDeals(period) {
  return D('invoices').filter(i => ['sold', 'completed'].includes(i.stage) && (!period || (i.soldAt || '').slice(0, 7) === period)).sort((a, b) => (b.soldAt || '').localeCompare(a.soldAt || ''));
}
App.pages.accounts = {
  render() {
    if (!can('accounts.view')) return denied('company accounts');
    const tab = App.ui.accountsTab || 'pnl';
    const period = App.ui.period || '';
    const months = [...new Set(D('invoices').filter(i => i.soldAt).map(i => i.soldAt.slice(0, 7)))].sort().reverse();
    const deals = soldDeals(period).map(i => Object.assign({ inv: i }, dealFinancials(i)));
    const T = k => deals.reduce((s, d) => s + d.pnl[k], 0);
    const kpis = `<div class="grid g4 section"><div class="kpi"><div class="label">Revenue (selling price)</div><div class="value">${money(T('selling'))}</div><div class="sub">${deals.length} vehicle${deals.length === 1 ? '' : 's'} sold</div></div>
      <div class="kpi"><div class="label">Total vehicle cost</div><div class="value">${money(T('totalCost'))}</div></div>
      <div class="kpi"><div class="label">Profit before commission</div><div class="value">${money(T('profitBefore'))}</div><div class="sub">commissions ${money(T('commission'))}</div></div>
      <div class="kpi accent"><div class="label">Net profit</div><div class="value">${money(T('net'))}</div></div></div>`;
    let body = '';
    if (tab === 'pnl') body = `<div class="card flush"><div class="table-wrap"><table class="t"><thead><tr><th>Stock</th><th>Invoice</th><th>Customer</th><th>Sold</th><th class="num">Selling</th><th class="num">Vehicle</th><th class="num">Accessories + parts</th><th class="num">Labour</th><th class="num">Other</th><th class="num">Total cost</th><th class="num">Profit before comm.</th><th class="num">Commission</th><th class="num">Net profit</th></tr></thead><tbody>

      <div class="row"><select id="period" style="width:auto"><option value="">All time</option>${months.map(m => opt(m, new Date(m + '-01').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }), period)).join('')}</select>${tab === 'pnl' ? '<button class="btn" data-act="exportPnl">Export CSV</button>' : ''}</div></div>

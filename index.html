<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horizon Vehicles — ERP + CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
/* Horizon Vehicles ERP — stylesheet
   Brand: Horizon purple #46267E. Resting state is neutral (white, ink, greys); purple appears only on hover/focus.
   Palette: brand #46267E · background #ffffff · ink #141218 (logo tyre black) · neutral greys for lines and muted text.
   Anything selected or important uses ink and weight, never a fixed purple fill.
   Type: Archivo (variable width). Motion: 160ms ease-out, small lifts only. */
:root {
  --night: #46267E;
  --brand: #46267E; --brand-deep: #46267E; --brand-2: #46267E;
  --brand-soft: rgba(70, 38, 126, .07); --brand-soft-2: rgba(70, 38, 126, .12); --brand-ring: rgba(70, 38, 126, .2);
  --ink: #141218; --muted: #65636e; --faint: #9a98a3; --paper: #ffffff; --card: #ffffff; --line: #e9e8ee; --line-2: #d8d7df;
  --ok: #1d8349; --ok-soft: #e4f4ea; --warn: #a2660a; --warn-soft: #fcf1dd; --bad: #c8102e; --bad-soft: #fbe7ea; --info: #1f5fa6; --info-soft: #e5eefa;
  --radius: 14px; --radius-md: 10px; --radius-sm: 7px;
  --font: 'Archivo', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --shadow-0: 0 1px 2px rgba(20, 18, 24, .04);
  --shadow: 0 1px 2px rgba(20, 18, 24, .05), 0 6px 20px -8px rgba(20, 18, 24, .12);
  --shadow-hi: 0 2px 4px rgba(20, 18, 24, .05), 0 14px 32px -12px rgba(70, 38, 126, .35);
  --ease: cubic-bezier(.2, .7, .2, 1); --t: 160ms;
  --soft: #fafafb; --soft-2: #f3f3f6; --topbar: rgba(255, 255, 255, .9); --label: #3a3845; --plate-bg: #ffffff; --plate-ink: #141218;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--font); font-size: 14px; line-height: 1.55; color: var(--ink); background: var(--paper); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
a { color: var(--ink); text-underline-offset: 3px; transition: color var(--t) var(--ease); }
a:hover { color: var(--brand-deep); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; }
::selection { background: var(--brand-ring); }
h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -.012em; }
h1 { font-size: 28px; font-weight: 800; font-stretch: 112%; line-height: 1.12; letter-spacing: -.02em; }
h2 { font-size: 17px; font-weight: 750; }
h3 { font-size: 14.5px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.hidden { display: none !important; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1; }
.stack > * + * { margin-top: 14px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) { .g2, .g3, .g4 { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 100%; }
.side { background: #ffffff; color: var(--ink); border-right: 1px solid var(--line); padding: 16px 12px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.brand { display: flex; flex-direction: column; align-items: stretch; padding: 2px 4px 12px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
.brand-logo { background: #fff; border-radius: 12px; padding: 8px 10px 4px; display: grid; place-items: center; transition: background var(--t) var(--ease); }
.brand-logo img { width: 100%; max-width: 188px; height: auto; display: block; }
a.brand-logo:hover { background: var(--brand-soft); }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: #fff; display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 22px; height: 22px; }
.brand-name { font-weight: 800; font-stretch: 125%; font-size: 15px; letter-spacing: .04em; color: var(--ink); line-height: 1.1; }
.brand-sub { font-size: 11.5px; color: var(--muted); padding: 0 6px 6px; display: flex; justify-content: space-between; gap: 6px; border-bottom: 1px solid var(--line); }
.brand-sub b { color: var(--ink); font-weight: 700; }
.nav-group { font-size: 11px; color: var(--faint); padding: 16px 12px 6px; font-weight: 700; letter-spacing: .03em; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav a { position: relative; display: flex; align-items: center; gap: 11px; padding: 8px 11px; border-radius: 9px; color: #3a3845; text-decoration: none; font-weight: 500; transition: background var(--t) var(--ease), color var(--t) var(--ease); }
.nav a svg { width: 17px; height: 17px; flex: none; color: var(--muted); transition: color var(--t) var(--ease), transform var(--t) var(--ease); }
.nav a:hover { background: var(--brand-soft); color: #46267E; }
.nav a:hover svg { color: #46267E; transform: translateX(2px); }
.nav a.active { background: var(--soft-2); color: var(--ink); font-weight: 700; box-shadow: none; }
.nav a.active svg { color: var(--ink); transform: none; }
.nav a.active::before { content: none; }
.nav .badge { margin-left: auto; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; border-radius: 10px; padding: 0 7px; line-height: 18px; }
.side-foot { margin-top: auto; padding: 14px 8px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.side-foot select { width: 100%; margin-top: 6px; cursor: pointer; }
.mode-pill { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; color: var(--ink); }
.mode-pill i { width: 8px; height: 8px; border-radius: 50%; background: #f5b94a; display: inline-block; box-shadow: 0 0 0 3px rgba(245, 185, 74, .2); }
.mode-pill.api i { background: #4ade80; box-shadow: 0 0 0 3px rgba(74, 222, 128, .2); }
.main { min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--topbar); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 11px 28px; }
.topbar .search { flex: 1; max-width: 540px; position: relative; }
.topbar .search input { width: 100%; padding: 10px 12px 10px 36px; border-radius: 11px; border: 1px solid var(--line); background: var(--soft); transition: border-color var(--t) var(--ease), background var(--t) var(--ease), box-shadow var(--t) var(--ease); }
.topbar .search input:hover { border-color: var(--line-2); background: var(--card); }
.topbar .search input:focus { background: var(--card); }
.topbar .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; color: var(--faint); pointer-events: none; }
.search-results { position: absolute; top: 48px; left: 0; right: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-hi); max-height: 380px; overflow: auto; z-index: 30; padding: 4px; }
.search-results a { display: flex; gap: 10px; align-items: center; padding: 9px 10px; text-decoration: none; color: var(--ink); border-radius: 8px; transition: background var(--t) var(--ease); }
.search-results a:hover { background: var(--brand-soft); }
.icon-btn { position: relative; width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; cursor: pointer; color: var(--ink); box-shadow: var(--shadow-0); transition: border-color var(--t) var(--ease), color var(--t) var(--ease), box-shadow var(--t) var(--ease), transform var(--t) var(--ease); }
.icon-btn:hover { border-color: var(--brand-2); color: var(--brand); box-shadow: var(--shadow); transform: translateY(-1px); }
.icon-btn:active { transform: translateY(0); }
.icon-btn svg { width: 18px; }
.icon-btn .dot { position: absolute; top: -5px; right: -5px; background: var(--bad); color: #fff; font-size: 10.5px; font-weight: 700; border-radius: 9px; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 4px; border: 2px solid var(--card); box-sizing: content-box; }
.me { display: flex; align-items: center; gap: 10px; padding: 4px 6px 4px 4px; border-radius: 12px; transition: background var(--t) var(--ease); }
.me:hover { background: var(--soft-2); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--soft-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); display: grid; place-items: center; font-weight: 700; font-size: 12.5px; flex: none; letter-spacing: .02em; transition: background var(--t) var(--ease), color var(--t) var(--ease); }
.avatar.sm { width: 26px; height: 26px; font-size: 11px; }
.me-name { font-weight: 700; line-height: 1.15; }
.me-role { font-size: 12px; color: var(--muted); }
.menu-btn { display: none; }
.content { padding: 28px 32px 64px; max-width: 1480px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head p { margin: 6px 0 0; color: var(--muted); max-width: 78ch; }
.crumbs { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--brand); text-decoration: underline; }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 268px; z-index: 50; transform: translateX(-100%); transition: transform .22s var(--ease); padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
  .side.open { transform: none; box-shadow: 0 0 0 100vmax rgba(20, 18, 24, .4); }
  .menu-btn { display: grid; }
  .topbar { padding: 10px 14px; top: env(safe-area-inset-top, 0px); }
  .content { padding: 20px 16px 60px; }
  .me-text { display: none; }
  h1 { font-size: 24px; }
}

/* ---------- Surfaces ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-0); }
.card.flush { padding: 0; overflow: hidden; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card.flush > .card-head { padding: 18px 20px 4px !important; }
.card-head p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.section { margin-bottom: 20px; }
.kpi { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; text-decoration: none; color: inherit; display: block; box-shadow: var(--shadow-0); overflow: hidden;
  transition: transform var(--t) var(--ease), box-shadow var(--t) var(--ease), border-color var(--t) var(--ease); }
.kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--brand); transform: scaleY(0); transform-origin: bottom; transition: transform var(--t) var(--ease); }
.kpi .label { color: var(--muted); font-size: 12.5px; font-weight: 500; }
.kpi .value { font-size: 28px; font-weight: 750; font-stretch: 85%; letter-spacing: -.015em; margin-top: 4px; line-height: 1.15; }
.kpi .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.kpi.accent { background: var(--card); color: var(--ink); border-color: var(--line); box-shadow: var(--shadow-0); }
.kpi.accent .label, .kpi.accent .sub { color: var(--muted); }
a.kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow-hi); border-color: rgba(70, 38, 126, .35); }
a.kpi:hover::before { transform: scaleY(1); }
a.kpi:hover .value { color: var(--brand); }
a.kpi.accent:hover .value { color: #fff; }
a.kpi:active { transform: translateY(0); }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.empty h3 { color: var(--ink); margin-bottom: 4px; font-size: 15px; }
.empty p { margin: 4px 0 0; }
.notice { border-radius: var(--radius-md); padding: 11px 14px; font-size: 13px; background: var(--info-soft); color: #173f6d; border: 1px solid rgba(31, 95, 166, .14); }
.notice.warn { background: var(--warn-soft); color: #6b4400; border-color: rgba(162, 102, 10, .18); }
.notice.bad { background: var(--bad-soft); color: #7a0d1e; border-color: rgba(200, 16, 46, .16); }
.notice.ok { background: var(--ok-soft); color: #11552e; border-color: rgba(29, 131, 73, .16); }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--soft); letter-spacing: .01em; }
table.t td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; transition: background var(--t) var(--ease); }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.click { cursor: pointer; }
table.t tr.click td:first-child { box-shadow: inset 0 0 0 0 var(--brand); transition: background var(--t) var(--ease), box-shadow var(--t) var(--ease); }
table.t tr.click:hover td { background: var(--brand-soft); }
table.t tr.click:hover td:first-child { box-shadow: inset 3px 0 0 0 var(--brand); }
table.t td.num, table.t th.num { text-align: right; }
table.t tfoot td { font-weight: 700; background: var(--soft); border-top: 1px solid var(--line-2); }
.money-neg { color: var(--bad); }
.money-pos { color: var(--ok); }

/* ---------- Plates, tags, badges ---------- */
.plate { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-stretch: 75%; font-size: 13.5px; letter-spacing: .05em; padding: 1px 8px; border: 1.5px solid var(--plate-ink); border-radius: 5px; background: var(--plate-bg); color: var(--plate-ink); line-height: 1.35; white-space: nowrap; box-shadow: inset 0 -2px 0 rgba(20, 18, 24, .06); }
.plate.lg { font-size: 20px; padding: 2px 11px; border-width: 2px; border-radius: 6px; }
.plate.none { border-style: dashed; border-color: var(--line-2); color: var(--faint); font-weight: 600; box-shadow: none; }
.code { font-weight: 700; font-stretch: 85%; color: var(--ink); white-space: nowrap; }
a.code { text-decoration: none; }
a.code:hover { text-decoration: underline; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 20px; background: var(--soft-2); color: var(--muted); white-space: nowrap; line-height: 1.6; }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.info { background: var(--info-soft); color: var(--info); }
.tag.brand { background: var(--soft-2); color: var(--label); }
.tag.dark { background: #141218; color: #fff; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); padding: 8px 15px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; font-size: 13.5px; line-height: 1.35; box-shadow: var(--shadow-0);
  transition: background var(--t) var(--ease), border-color var(--t) var(--ease), color var(--t) var(--ease), box-shadow var(--t) var(--ease), transform var(--t) var(--ease); }
.btn:hover { border-color: #46267E; color: #46267E; background: var(--brand-soft); transform: translateY(-1px); box-shadow: var(--shadow); }
.btn:active { transform: translateY(0); box-shadow: var(--shadow-0); }
.btn.primary { background: var(--card); border-color: var(--ink); color: var(--ink); font-weight: 700; box-shadow: var(--shadow-0); }
.btn.primary:hover { background: #46267E; border-color: #46267E; color: #fff; box-shadow: 0 10px 20px -6px rgba(70, 38, 126, .6); }
.btn.dark { background: #141218; border-color: #141218; color: #fff; }
.btn.dark:hover { background: #2b2536; border-color: #2b2536; color: #fff; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.ok:hover { background: #166a3a; border-color: #166a3a; color: #fff; }
.btn.danger { color: var(--bad); border-color: rgba(200, 16, 46, .3); }
.btn.danger:hover { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.btn.wa { background: #25d366; border-color: #25d366; color: #073b1c; }
.btn.wa:hover { background: #1fbd5a; border-color: #1fbd5a; color: #052b14; }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
.btn.ghost:hover { background: var(--soft-2); border-color: transparent; color: var(--ink); box-shadow: none; }
.btn.sm { padding: 5px 11px; font-size: 12.5px; border-radius: 8px; }
.btn:disabled, .btn:disabled:hover { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn svg { width: 15px; height: 15px; transition: transform var(--t) var(--ease); }
.btn:hover svg { transform: rotate(90deg); }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--label); }
.field > span em { font-style: normal; color: var(--faint); font-weight: 500; }
.field .hint { font-size: 12px; color: var(--muted); }
.field .err { font-size: 12px; color: var(--bad); }
input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], input[type=password], input[type=search], select, textarea {
  border: 1px solid var(--line-2); border-radius: var(--radius-md); padding: 9px 11px; background: var(--card); width: 100%; min-width: 0;
  transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease), background var(--t) var(--ease); }
input:hover:not(:disabled), select:hover:not(:disabled), textarea:hover:not(:disabled) { border-color: var(--brand-2); }
select { cursor: pointer; }
input:disabled, select:disabled, textarea:disabled { background: var(--soft); color: var(--muted); cursor: not-allowed; }
textarea { min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-ring); }
.invalid { border-color: var(--bad) !important; box-shadow: 0 0 0 4px rgba(200, 16, 46, .12) !important; }
.form-grid { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 640px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
.fset { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 16px; }
.fset > h3 { margin-bottom: 12px; color: var(--ink); }
.check { display: flex; gap: 8px; align-items: center; font-size: 13.5px; cursor: pointer; padding: 4px 6px; margin: -4px -6px; border-radius: 7px; transition: background var(--t) var(--ease); }
.check:hover { background: var(--brand-soft); }
.check input { width: 16px; height: 16px; accent-color: #141218; cursor: pointer; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.toolbar input[type=search] { max-width: 300px; }
.toolbar select { width: auto; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius-md); overflow: hidden; background: var(--card); padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 13px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); border-radius: 7px; transition: background var(--t) var(--ease), color var(--t) var(--ease); }
.seg button:hover { background: var(--brand-soft); color: #46267E; }
.seg button.on { background: var(--soft-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
.tabs a { position: relative; padding: 11px 14px; text-decoration: none; color: var(--muted); font-weight: 600; white-space: nowrap; border-radius: 8px 8px 0 0; transition: color var(--t) var(--ease), background var(--t) var(--ease); }
.tabs a::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--ink); transform: scaleX(0); transition: transform var(--t) var(--ease); }
.tabs a:hover { color: var(--ink); background: var(--soft-2); }
.tabs a:hover::after { transform: scaleX(.4); }
.tabs a.on { color: var(--ink); }
.tabs a.on::after { transform: scaleX(1); }
.tabs a .n { font-size: 11px; background: var(--soft-2); border-radius: 10px; padding: 0 6px; margin-left: 5px; color: var(--muted); }
.tabs a.on .n { background: var(--soft-2); color: var(--ink); }

/* ---------- Deal route (stage track) — the signature element ---------- */
.route { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px 18px; margin-bottom: 20px; position: relative; overflow: hidden; box-shadow: var(--shadow-0); }
.route-top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.route-title { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

.route-meta b { color: var(--ink); font-weight: 600; }

.stations { display: grid; grid-template-columns: repeat(10, minmax(84px, 1fr)); margin-top: 22px; overflow-x: auto; padding-bottom: 2px; }
.station { position: relative; padding-top: 24px; font-size: 12px; color: var(--faint); min-width: 84px; }
.station::before { content: ''; position: absolute; top: 7px; left: 0; right: 0; height: 2px; background: var(--line); }
.station:first-child::before { left: 8px; }
.station:last-child::before { right: calc(100% - 8px); }
.station .pin { position: absolute; top: 0; left: 0; width: 16px; height: 16px; border-radius: 50%; background: var(--card); border: 2px solid var(--line-2); }
.station .nm { font-weight: 600; color: var(--muted); display: block; line-height: 1.25; padding-right: 6px; }
.station .dp { font-size: 11px; color: var(--faint); }
.station.done::before { background: #9a98a3; }

.station.done .nm { color: var(--ink); }
.station.now .pin { background: #141218; border-color: #141218; box-shadow: 0 0 0 5px rgba(20, 18, 24, .1); }
.station.now .nm { color: var(--ink); font-weight: 800; }
.station.now .dp { color: var(--muted); }
.next-bar { margin-top: 18px; background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 12px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.next-bar .who { color: var(--muted); font-size: 12.5px; }
.next-bar .what { font-weight: 700; }
.sla { display: inline-flex; align-items: center; gap: 10px; background: #fff; color: #141218; border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px 8px 8px; }
.sla svg { width: 42px; height: 42px; transform: rotate(-90deg); }
.sla .t { font-weight: 800; font-stretch: 85%; font-size: 16px; line-height: 1.1; }
.sla .l { font-size: 11.5px; color: #65636e; }
.sla.over .t { color: #c8102e; }
.sla.done .t { color: #1d8349; }

/* ---------- Pipeline board ---------- */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(236px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; }
.lane { background: var(--soft-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; min-height: 120px; }
.lane h3 { font-size: 13px; display: flex; justify-content: space-between; margin: 4px 6px 10px; }
.deal { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 11px 12px; margin-bottom: 8px; cursor: pointer; font-size: 13px; box-shadow: var(--shadow-0); transition: transform var(--t) var(--ease), box-shadow var(--t) var(--ease), border-color var(--t) var(--ease); }
.deal:hover { border-color: var(--brand-2); transform: translateY(-2px); box-shadow: var(--shadow-hi); }
.deal .top { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 4px; }

/* ---------- Media ---------- */
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumb { width: 98px; height: 74px; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--line); background: var(--soft-2); position: relative; display: block; transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease), transform var(--t) var(--ease); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s var(--ease); }

.thumb:hover img { transform: scale(1.06); }
.thumb .x { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(20, 18, 24, .7); color: #fff; cursor: pointer; font-size: 12px; line-height: 20px; padding: 0; transition: background var(--t) var(--ease); }

.car-img { width: 64px; height: 46px; border-radius: 8px; object-fit: cover; background: var(--soft-2); display: block; }
.dropzone { border: 1.5px dashed var(--line-2); border-radius: var(--radius-md); padding: 16px; text-align: center; color: var(--muted); cursor: pointer; background: var(--soft); font-size: 13px; font-weight: 500; transition: border-color var(--t) var(--ease), color var(--t) var(--ease), background var(--t) var(--ease); }

.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* ---------- Document slots ---------- */
.docslot { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 15px 16px; background: var(--soft); transition: border-color var(--t) var(--ease), background var(--t) var(--ease), box-shadow var(--t) var(--ease); }

/* ---------- Modal, drawer, toast ---------- */
.overlay { position: fixed; inset: 0; background: rgba(20, 18, 24, .4); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 5vh 14px; overflow-y: auto; animation: fadein .16s ease-out; }
.modal { background: var(--card); border-radius: 18px; width: 100%; max-width: 620px; box-shadow: 0 24px 64px rgba(20, 12, 40, .35); border: 1px solid var(--line); animation: pop .2s var(--ease); }

@keyframes fadein { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.985); } }
.toasts { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: 380px; }
.toast { background: #141218; color: #fff; padding: 12px 16px; border-radius: 12px; box-shadow: 0 12px 28px -10px rgba(20, 18, 24, .45); font-size: 13.5px; animation: tin .2s var(--ease); }
.toast.bad { background: var(--bad); }

.pop { position: absolute; right: 0; top: 50px; width: 360px; max-width: 90vw; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-hi); z-index: 40; max-height: 460px; overflow: auto; padding: 4px; animation: pop .16s var(--ease); }
.pop .pop-item { padding: 10px 12px; border-radius: 9px; font-size: 13px; cursor: pointer; transition: background var(--t) var(--ease); }
.pop .pop-item + .pop-item { margin-top: 2px; }
.pop .pop-item:hover { background: var(--brand-soft); }

/* ---------- Role matrix ---------- */
.matrix th.rot { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; padding: 12px 4px; font-size: 12px; vertical-align: bottom; }

/* ---------- Login ---------- */
.login { min-height: 100vh; display: grid; place-items: center; background: #ffffff; padding: 20px; }
.login .card { width: 100%; max-width: 420px; padding: 30px; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--line); }

/* ---------- Moving purple highlight ----------
   The solid #46267E highlight follows the pointer: whatever is hovered turns purple with white text.
   Nothing is purple at rest, so at most one element (the one under the pointer) is purple at a time. */
:root { --hl: #46267E; --hl-text: #ffffff; --hl-shadow: 0 10px 22px -10px rgba(70, 38, 126, .65); }

/* Sidebar menu */
.nav a:hover { background: var(--hl); color: var(--hl-text); box-shadow: var(--hl-shadow); }

/* Stat boxes and pipeline boxes */

/* Buttons (brand-coloured ones keep their own colour family) */
.btn:hover, .btn.ghost:hover, .btn.dark:hover { background: var(--hl); border-color: var(--hl); color: var(--hl-text); box-shadow: var(--hl-shadow); }

.tabs a:hover::after { transform: scaleX(0); }

/* Upload areas, document boxes, photos, logo, profile */
.dropzone:hover { background: var(--hl); border-color: var(--hl); border-style: solid; color: var(--hl-text); }
.docslot:hover { border-color: var(--hl); box-shadow: 0 0 0 1px var(--hl), var(--shadow); }

a.brand-logo:hover { background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--hl); }
.crumbs a:hover { color: var(--hl); }
.matrix tbody tr:not(.grp):hover td { background: var(--brand-soft-2); }
.matrix th.rot a:hover { color: var(--hl); }


/* ---------- Motion preferences ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; }

  .thumb:hover img, .btn:hover svg, .nav a:hover svg { transform: none; }
}

    { group: 'Workshop', items: [

    { group: 'Administration', items: [
      ['users.manage', 'Manage users'],
      ['roles.manage', 'Manage roles & permissions'],
      ['teams.manage', 'Manage teams & departments'],
      ['companies.manage', 'Manage companies & bank details'],
      ['settings.manage', 'Manage settings'],
      ['audit.view', 'View activity log'],
    ]},
  ];
  const ALL_PERMS = PERMISSION_GROUPS.flatMap(g => g.items.map(i => i[0]));
  const PERM_LABEL = Object.fromEntries(PERMISSION_GROUPS.flatMap(g => g.items));

  const pick = (...keys) => Object.fromEntries(ALL_PERMS.map(k => [k, keys.includes(k)]));
  const DEFAULT_ROLES = [
    { id: 'role_super_admin', name: 'Super Admin', system: true, description: 'Full access to everything, including roles and users.', permissions: Object.fromEntries(ALL_PERMS.map(k => [k, true])) },
    { id: 'role_director', name: 'Director', system: false, description: 'Oversees deals end-to-end and marks vehicles SOLD.', permissions: pick('customers.view','invoices.view','scope.all_records','sales.approve_final','accounts.view','accounts.commissions','commissions.view_own','director.mark_sold','stock.view','stock.view_cost','accessories.view','audit.view') },
    { id: 'role_sales_manager', name: 'Sales Manager', system: false, description: 'Leads a sales team; sees team invoices.', permissions: pick('customers.view','customers.create','customers.edit','invoices.view','invoices.create','invoices.send','jobcards.create','sales.approve_final','payments.upload_receipt','commissions.view_own','stock.view') },
    { id: 'role_sales_agent', name: 'Sales Agent', system: false, description: 'Creates customers and invoices, uploads job cards.', permissions: pick('customers.view','customers.create','customers.edit','invoices.view','invoices.create','invoices.send','jobcards.create','sales.approve_final','commissions.view_own','stock.view') },
    { id: 'role_accountant', name: 'Finance / Accountant', system: false, description: 'Confirms payments, records expenses, pays commissions.', permissions: pick('customers.view','invoices.view','scope.all_records','payments.upload_receipt','payments.upload_swift','accounts.view','accounts.expenses','accounts.commissions','stock.view','stock.view_cost','accessories.view') },
    { id: 'role_operations', name: 'Operations (Thailand)', system: false, description: 'Assigns stock, runs the workshop, submits final look.', permissions: pick('customers.view','invoices.view','scope.all_records','operations.assign_stock','operations.send_mechanic','operations.qc_submit','stock.view','stock.add','stock.edit','accessories.view','accessories.manage','mechanics.manage','accounts.expenses') },
    { id: 'role_mechanic', name: 'Mechanic', system: false, description: 'Sees only own work orders and enters bills.', permissions: pick('mechanic.bill','accessories.view') },
    { id: 'role_shipping', name: 'Shipping', system: false, description: 'Uploads B/L, export and shipment documents.', permissions: pick('customers.view','invoices.view','scope.all_records','shipping.manage','stock.view') },
    { id: 'role_data_entry', name: 'Data Entry', system: false, description: 'Adds vehicles and accessories.', permissions: pick('stock.view','stock.add','stock.edit','accessories.view','accessories.manage') },
    { id: 'role_viewer', name: 'Viewer', system: false, description: 'Read-only access to stock.', permissions: pick('stock.view') },
  ];

  /* ---------- Deal workflow ---------- */
  const STAGES = [
    { key: 'draft',            label: 'Draft',            dept: 'Sales',      perm: 'invoices.create' },
    { key: 'sent',             label: 'Invoice sent',     dept: 'Sales',      perm: 'invoices.send' },
    { key: 'receipt_uploaded', label: 'Payment receipt',  dept: 'Sales / Finance', perm: 'payments.upload_receipt' },
    { key: 'job_card',         label: 'Job card',         dept: 'Sales',      perm: 'jobcards.create' },
    { key: 'stock_assigned',   label: 'Stock assigned',   dept: 'Operations', perm: 'operations.assign_stock' },
    { key: 'in_workshop',      label: 'Workshop',         dept: 'Mechanics',  perm: 'operations.send_mechanic' },
    { key: 'qc_review',        label: 'Final review',     dept: 'Operations', perm: 'operations.qc_submit' },
    { key: 'sales_approved',   label: 'Sales approved',   dept: 'Sales',      perm: 'sales.approve_final' },
    { key: 'sold',             label: 'Sold',             dept: 'Director',   perm: 'director.mark_sold' },
    { key: 'completed',        label: 'Shipped',          dept: 'Shipping',   perm: 'shipping.manage' },
  ];
  const STAGE_INDEX = Object.fromEntries(STAGES.map((s, i) => [s.key, i]));
  const STAGE = Object.fromEntries(STAGES.map(s => [s.key, s]));

  /* What each stage is waiting for, and which permission can do it. */
  const NEXT_ACTION = {
    draft:            { perm: 'invoices.send',           text: 'Send the invoice to the customer' },
    sent:             { perm: 'payments.upload_receipt', text: 'Upload the customer\u2019s payment receipt' },
    receipt_uploaded: { perm: 'jobcards.create',         text: 'Upload the job card' },
    job_card:         { perm: 'operations.assign_stock', text: 'Assign a stock ID and chassis number' },
    stock_assigned:   { perm: 'operations.send_mechanic',text: 'Send the vehicle to mechanics (or submit for review if no work is needed)' },
    in_workshop:      { perm: 'operations.qc_submit',    text: 'Finish workshop jobs, then submit the final look for review' },
    qc_review:        { perm: 'sales.approve_final',     text: 'Approve the final look or send it back for rework' },
    sales_approved:   { perm: 'director.mark_sold',      text: 'Mark the vehicle SOLD' },
    sold:             { perm: 'shipping.manage',         text: 'Upload B/L, export and shipment documents' },
    completed:        null,
  };

  const DOC_TYPES = {
    payment_receipt: 'Payment receipt',
    swift: 'SWIFT document',
    vehicle_certificate: 'Vehicle certificate',
    bill_of_lading: 'Bill of Lading (B/L)',
    export_document: 'Export document',
    shipment_document: 'Shipment document',
    mechanic_bill: 'Mechanic bill',
    expense_bill: 'Expense bill',
    other: 'Other document',
  };
  const SHIPPING_DOCS = ['bill_of_lading', 'export_document', 'shipment_document'];

  const WORK_TYPES = ['Painting', 'Denting', 'Mechanical', 'Engine', 'Electrical', 'Interior / upholstery', 'Tyres & alloys', 'Detailing', 'Accessory fitting', 'Other'];
  const VEHICLE_STATUSES = ['Available', 'On Hold', 'Reserved', 'Allocated', 'In Workshop', 'Ready', 'Sold', 'Shipped'];
  const ASSIGNABLE_STATUSES = ['Available', 'On Hold', 'Reserved'];
  const EXPENSE_CATEGORIES = ['Transport / towing', 'Inspection', 'Registration & documents', 'Yard / storage', 'Freight', 'Parts (outside workshop)', 'Other'];

  /* ---------- Normalisers & ID formats ---------- */
  const normEmail = v => String(v || '').trim().toLowerCase();
  const normPhone = v => String(v || '').replace(/[^\d]/g, '');
  const pad = (n, w) => String(n).padStart(w, '0');

  /* Human-readable codes. counterKey decides which counter increments. */
  const CODES = {
    customers:   { field: 'code', counterKey: () => 'CUST', format: n => 'CUST-' + pad(n, 5) },
    invoices:    { field: 'invoiceNo', counterKey: o => 'INV-' + (o.companyCode || 'HV') + '-' + new Date().getFullYear(), format: (n, o) => (o.companyCode || 'HV') + '-' + new Date().getFullYear() + '-' + pad(n, 4) },
    accessories: { field: 'code', counterKey: () => 'ACC', format: n => 'ACC-' + pad(n, 4) },
    jobCards:    { field: 'code', counterKey: () => 'JC', format: n => 'JC-' + pad(n, 5) },
    workOrders:  { field: 'code', counterKey: () => 'WO', format: n => 'WO-' + pad(n, 5) },
    expenses:    { field: 'code', counterKey: () => 'EXP', format: n => 'EXP-' + pad(n, 5) },
    commissions: { field: 'code', counterKey: () => 'COM', format: n => 'COM-' + pad(n, 5) },
    mechanics:   { field: 'code', counterKey: () => 'MEC', format: n => 'MEC-' + pad(n, 3) },
  };

  /* Uniqueness rules (mirrored by UNIQUE indexes in db/schema.sql). */
  const UNIQUE = {
    customers: [
      { field: 'emailNorm', from: o => normEmail(o.email), label: 'email address' },
      { field: 'phoneNorm', from: o => normPhone(o.phone), label: 'phone number' },
    ],
    users: [{ field: 'emailNorm', from: o => normEmail(o.email), label: 'email address' }],
    vehicles: [{ field: 'stockId', from: o => String(o.stockId || '').trim(), label: 'stock ID' }],
  };
  function applyDerived(col, obj) {
    (UNIQUE[col] || []).forEach(u => { obj[u.field] = u.from(obj) || null; });
    return obj;
  }

  /* ---------- Money ---------- */
  const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
  const round2 = n => Math.round(n * 100) / 100;
  function invoiceTotal(inv) { return round2((inv.rows || []).reduce((s, r) => s + num(r.cnf), 0)); }
  function invoiceBalance(inv) { return round2(invoiceTotal(inv) - num(inv.depositReceived)); }

  /* Total landed cost of a vehicle: purchase + parts/accessories + labour + other expenses. */
  function vehicleCost(vehicle, workOrders, expenses) {
    const out = { purchase: num(vehicle && vehicle.buyingPrice), accessories: 0, parts: 0, labour: 0, other: 0 };
    (workOrders || []).forEach(wo => (wo.lines || []).forEach(l => {
      const t = num(l.qty || 1) * num(l.unitPrice);
      if (l.kind === 'accessory') out.accessories += t;
      else if (l.kind === 'labour') out.labour += t;
      else out.parts += t;
    }));
    (expenses || []).forEach(e => { out.other += num(e.amount); });
    Object.keys(out).forEach(k => out[k] = round2(out[k]));
    out.total = round2(out.purchase + out.accessories + out.parts + out.labour + out.other);
    return out;
  }

  /* Deal P&L. basis: 'profit' (commission on profit before commission) or 'selling' (on selling price). */
  function dealPnL(sellingPrice, totalCost, commissionPct, basis) {
    const selling = round2(num(sellingPrice));
    const profitBefore = round2(selling - num(totalCost));
    const base = basis === 'selling' ? selling : Math.max(0, profitBefore);
    const commission = round2(base * num(commissionPct) / 100);
    return { selling, totalCost: round2(num(totalCost)), profitBefore, commissionPct: num(commissionPct), commissionBase: base, commission, net: round2(profitBefore - commission) };
  }

  /* ---------- Workflow validation ----------
     ctx = { docs:[...active docs for invoice], jobCard, vehicle, workOrders:[...] } */
  function hasDoc(ctx, type) { return (ctx.docs || []).some(d => d.docType === type && d.active !== false); }

  function checkStageRequirements(inv, to, ctx) {
    switch (to) {
      case 'draft': return null;
      case 'sent':
        if (!inv.invoiceNo) return 'The invoice needs an invoice number first.';
        if (invoiceTotal(inv) <= 0) return 'Add at least one vehicle line with a CNF price before sending.';
        return null;
      case 'receipt_uploaded':
        return hasDoc(ctx, 'payment_receipt') ? null : 'Upload the payment receipt first.';
      case 'job_card':
        return ctx.jobCard && ctx.jobCard.status === 'submitted' ? null : 'Submit the job card first.';
      case 'stock_assigned':
        if (!inv.stockId || !inv.chassisNo) return 'Assign both a stock ID and a chassis number.';
        if (!ctx.vehicle) return 'Stock ' + inv.stockId + ' is not in Stock or Deposit inventory.';
        if (ctx.vehicle.allocatedInvoiceId && ctx.vehicle.allocatedInvoiceId !== inv.id) return 'Stock ' + inv.stockId + ' is already assigned to another invoice.';
        return null;
      case 'in_workshop':
        return (ctx.workOrders || []).length ? null : 'Create at least one mechanic work order.';
      case 'qc_review': {
        const open = (ctx.workOrders || []).filter(w => w.status !== 'completed');
        if (open.length) return open.length + ' work order(s) are still open. Mechanics must complete them first.';
        if (!(inv.finalPhotos || []).length) return 'Upload at least one photo of the vehicle\u2019s final look.';
        return null;
      }
      case 'sales_approved': return null;
      case 'sold':
        return inv.paymentConfirmed ? null : 'Finance must upload the SWIFT document to confirm payment before the vehicle can be marked SOLD.';
      case 'completed': {
        const missing = SHIPPING_DOCS.filter(t => !hasDoc(ctx, t));
        return missing.length ? 'Still missing: ' + missing.map(t => DOC_TYPES[t]).join(', ') + '.' : null;
      }
      default: return 'Unknown stage.';
    }
  }

  /* Allowed moves: one step forward; workshop can be skipped; final review can go back to workshop (rework). */
  function isAllowedMove(from, to) {
    const a = STAGE_INDEX[from], b = STAGE_INDEX[to];
    if (a === undefined || b === undefined) return false;
    if (b === a + 1) return true;
    if (from === 'stock_assigned' && to === 'qc_review') return true;
    if (from === 'qc_review' && to === 'in_workshop') return true;
    return false;
  }

  /* Returns an error string, or null when the transition is valid. */
  function validateTransition(inv, from, to, ctx, hasPerm) {
    if (from === to) return null;
    if (!isAllowedMove(from, to)) return 'An invoice can\u2019t move from \u201c' + (STAGE[from] || {}).label + '\u201d to \u201c' + (STAGE[to] || {}).label + '\u201d.';
    const needed = (from === 'qc_review' && to === 'in_workshop') ? 'sales.approve_final' : STAGE[to].perm;
    if (hasPerm && !hasPerm(needed)) return 'You need the \u201c' + PERM_LABEL[needed] + '\u201d permission for this step.';
    if (from === 'qc_review' && to === 'in_workshop') return null;
    return checkStageRequirements(inv, to, ctx);
  }

  /* 7-day readiness clock. */
  function slaState(inv, now) {
    if (!inv.readyDueAt) return null;
    const due = new Date(inv.readyDueAt).getTime();
    const end = inv.readyAt ? new Date(inv.readyAt).getTime() : (now || Date.now());
    const ms = due - end;
    return { due, ms, overdue: ms < 0, stopped: !!inv.readyAt };
  }

  return {
    PERMISSION_GROUPS, ALL_PERMS, PERM_LABEL, DEFAULT_ROLES,
    STAGES, STAGE, STAGE_INDEX, NEXT_ACTION, DOC_TYPES, SHIPPING_DOCS,
    WORK_TYPES, VEHICLE_STATUSES, ASSIGNABLE_STATUSES, EXPENSE_CATEGORIES,
    CODES, UNIQUE, applyDerived, normEmail, normPhone, pad,
    num, round2, invoiceTotal, invoiceBalance, vehicleCost, dealPnL,
    validateTransition, checkStageRequirements, isAllowedMove, slaState,
  };
});

<script>
/* Horizon Vehicles ERP — data layer.
   The UI talks only to `Store`. Two interchangeable adapters:
   - api:   the Node/PostgreSQL server (production). Auth by JWT.
   - local: IndexedDB in this browser (demo / offline preview). Enforces the same rules. */
(function () {
  const R = window.HNXRules;
  const COLLECTIONS = ['companies', 'settings', 'roles', 'teams', 'users', 'customers', 'invoices', 'documents', 'jobCards',
    'vehicles', 'accessories', 'stockMoves', 'mechanics', 'workOrders', 'expenses', 'commissions', 'notifications', 'audit'];

  const uid = p => (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const clone = o => JSON.parse(JSON.stringify(o));
  class AppError extends Error { constructor(msg, status) { super(msg); this.status = status || 400; } }

  function uniqueViolation(data, col, obj) {
    for (const u of (R.UNIQUE[col] || [])) {
      const v = obj[u.field];
      if (!v) continue;
      const clash = (data[col] || []).find(x => x.id !== obj.id && x[u.field] === v);
      if (clash) return 'Another ' + col.replace(/s$/, '') + ' (' + (clash.code || clash.name || clash.stockId) + ') already uses this ' + u.label + '.';
    }
    return null;
  }
  function invoiceCtx(data, inv) {
    return {
      docs: data.documents.filter(d => d.invoiceId === inv.id && d.active !== false),
      jobCard: data.jobCards.find(j => j.invoiceId === inv.id),
      vehicle: inv.stockId ? data.vehicles.find(v => v.stockId === String(inv.stockId) && (v.inventoryType === 'stock' || v.inventoryType === 'deposit')) : null,
      workOrders: data.workOrders.filter(w => w.invoiceId === inv.id),
    };
  }

  /* ---------------- IndexedDB (local) adapter ---------------- */
  const idb = {
    db: null,
    open() {
      return new Promise((res, rej) => {
        const req = indexedDB.open('horizon-vehicles-erp', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('kv');
        req.onsuccess = () => { this.db = req.result; res(); };
        req.onerror = () => rej(req.error);
      });
    },
    get(k) { return new Promise((res, rej) => { const r = this.db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
    set(k, v) { return new Promise((res, rej) => { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
    keys() { return new Promise((res, rej) => { const r = this.db.transaction('kv').objectStore('kv').getAllKeys(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
    clear() { return new Promise((res, rej) => { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').clear(); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  };

  const LocalAdapter = {
    mode: 'local', state: null, fileCache: {}, saveTimer: null,
    async init() {
      await idb.open();
      let st = await idb.get('state');
      if (!st) st = this.freshState();
      COLLECTIONS.forEach(c => { if (!st.collections[c]) st.collections[c] = []; });
      this.state = st;
      const keys = await idb.keys();
      for (const k of keys) if (String(k).startsWith('file:')) this.fileCache[k.slice(5)] = await idb.get(k);
      await this.flush();
      return { data: st.collections, me: null, meta: st.meta };
    },
    freshState() {
      const seed = window.HNXSeed(R, window.HNX_SEED_VEHICLES);
      const collections = {};
      COLLECTIONS.forEach(c => collections[c] = clone(seed[c] || []));
      return { version: 1, collections, counters: Object.assign({}, seed.counters), meta: { viewingAs: 'u_huzaifa' } };
    },
    async reset() { await idb.clear(); this.fileCache = {}; this.state = this.freshState(); await this.flush(); },
    flush() { return idb.set('state', this.state); },
    persist() { clearTimeout(this.saveTimer); this.saveTimer = setTimeout(() => this.flush(), 150); },
    nextCounter(key) { this.state.counters[key] = (this.state.counters[key] || 0) + 1; return this.state.counters[key]; },
    async insert(col, obj) {
      const data = this.state.collections;
      const rec = Object.assign({}, clone(obj), { id: obj.id || uid(col.slice(0, 4)), createdAt: obj.createdAt || new Date().toISOString() });
      const code = R.CODES[col];
      if (code && !rec[code.field]) rec[code.field] = code.format(this.nextCounter(code.counterKey(rec)), rec);
      R.applyDerived(col, rec);
      const clash = uniqueViolation(data, col, rec);
      if (clash) throw new AppError(clash, 409);
      data[col].push(rec);
      this.persist();
      return clone(rec);
    },
    async update(col, id, patch, perms) {
      const data = this.state.collections;
      const i = data[col].findIndex(x => x.id === id);
      if (i < 0) throw new AppError('Record not found.', 404);
      const old = data[col][i];
      const next = Object.assign({}, old, clone(patch), { id, updatedAt: new Date().toISOString() });
      R.applyDerived(col, next);
      const clash = uniqueViolation(data, col, next);
      if (clash) throw new AppError(clash, 409);
      if (col === 'invoices' && patch.stage && patch.stage !== old.stage) {
        const err = R.validateTransition(next, old.stage, patch.stage, invoiceCtx(data, next), p => !perms || !!perms[p]);
        if (err) throw new AppError(err, 422);
      }
      data[col][i] = next;
      this.persist();
      return clone(next);
    },
    async remove(col, id) {
      const data = this.state.collections;
      data[col] = data[col].filter(x => x.id !== id);
      this.persist();
    },
    async upload(file) {
      const id = uid('file');
      const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); });
      await idb.set('file:' + id, dataUrl);
      this.fileCache[id] = dataUrl;
      return { fileId: id, name: file.name, mime: file.type, size: file.size };
    },
    fileUrl(meta) { return meta ? (meta.url || this.fileCache[meta.fileId] || '') : ''; },
    async setMeta(k, v) { this.state.meta[k] = v; await this.flush(); },
    exportJson() { return JSON.stringify(this.state, null, 1); },
    async importJson(text) { const st = JSON.parse(text); if (!st.collections) throw new AppError('This file is not a Horizon Vehicles backup.'); this.state = st; await this.flush(); },
  };

  /* ---------------- REST API adapter ---------------- */
  const tokenKey = 'hnx_token';
  const getToken = () => { try { return localStorage.getItem(tokenKey) || ''; } catch (e) { return ''; } };
  const setToken = t => { try { t ? localStorage.setItem(tokenKey, t) : localStorage.removeItem(tokenKey); } catch (e) {} };

  const ApiAdapter = {
    mode: 'api', data: null,
    async call(method, path, body, isForm) {
      const headers = { Authorization: 'Bearer ' + getToken() };
      if (body && !isForm) headers['Content-Type'] = 'application/json';
      const res = await fetch('/api' + path, { method, headers, body: body ? (isForm ? body : JSON.stringify(body)) : undefined });
      let json = {};
      try { json = await res.json(); } catch (e) {}
      if (!res.ok) throw new AppError(json.error || ('Request failed (' + res.status + ').'), res.status);
      return json;
    },
    async login(email, password) { const r = await this.call('POST', '/auth/login', { email, password }); setToken(r.token); return r; },
    logout() { setToken(''); },
    async init() {
      if (!getToken()) throw new AppError('Sign in required.', 401);
      const r = await this.call('GET', '/bootstrap');

  /* Downscale photos before upload: keeps the database and bandwidth light. */
  async function compressImage(file, maxSide) {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
    maxSide = maxSide || 1600;
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });

    { id: 'settings', label: 'Settings', icon: 'gear', perm: 'settings.manage' },
  ]},
];
const navAllowed = it => it.perm ? can(it.perm) : it.any ? canAny(...it.any) : true;

function renderShell() {
  const me = App.me;
  const isLocal = App.store.mode === 'local';
  const notifs = myNotifications(); const unread = notifs.filter(n => !(n.readBy || []).includes(me.id)).length;
  document.body.innerHTML = `
  <div class="shell">
    <aside class="side" id="side">

      <div class="side-foot">

      </div>
    </aside>

        <div class="grow"></div>
        <div style="position:relative">
          <button class="icon-btn" data-act="notifs" aria-label="Notifications">${svg('bell')}${unread ? `<span class="dot">${unread}</span>` : ''}</button>

      </header>

    </div>
  </div>`;
  const va = $('#viewAs');
  if (va) va.onchange = async () => { App.me = byId('users', va.value); await App.store.setMeta('viewingAs', va.value); renderShell(); route(); toast('Viewing as ' + App.me.name + ' (' + roleOf(App.me).name + ')'); };
  bindSearch();
}

function bindSearch() {
  const inp = $('#gsearch'), box = $('#gresults');
  inp.oninput = () => {
    const q = inp.value.trim().toLowerCase();
    if (q.length < 2) { box.classList.add('hidden'); return; }
    const hits = [];
    visibleCustomers().forEach(c => { if ([c.code, c.name, c.email, c.phone, c.country].join(' ').toLowerCase().includes(q)) hits.push(`<a href="#/customers/${c.id}"><span class="code">${esc(c.code)}</span> ${esc(c.name)} <span class="muted small">${esc(c.email)}</span></a>`); });
    visibleInvoices().forEach(i => { const c = customer(i.customerId); if ([i.invoiceNo, i.stockId, i.chassisNo, c && c.name].join(' ').toLowerCase().includes(q)) hits.push(`<a href="#/deals/${i.id}"><span class="code">${esc(i.invoiceNo)}</span> ${esc(c ? c.name : '')} ${i.stockId ? plate(i.stockId) : ''}</a>`); });
    if (can('stock.view')) D('vehicles').forEach(v => { if ([v.stockId, v.chassisNo, v.make, v.model].join(' ').toLowerCase().includes(q)) hits.push(`<a href="#/vehicle/${v.id}">${plate(v.stockId)} ${esc(v.year + ' ' + v.make + ' ' + v.model)} <span class="muted small">${esc(v.status)}</span></a>`); });
    box.innerHTML = hits.slice(0, 14).join('') || '<div class="empty small">No matches.</div>';
    box.classList.remove('hidden');
  };
  inp.onblur = () => setTimeout(() => box.classList.add('hidden'), 200);
}

/* ---------------- router ---------------- */
function parseHash() {
  const parts = (location.hash || '#/dashboard').replace(/^#\/?/, '').split('/');
  return { page: parts[0] || 'dashboard', id: parts[1] ? decodeURIComponent(parts[1]) : null, tab: parts[2] || null };
}
function route() {
  App.route = parseHash();
  const pg = App.pages[App.route.page] || App.pages.dashboard;
  $$('.nav a').forEach(a => a.classList.toggle('active', a.dataset.nav === App.route.page || (App.route.page === 'vehicle' && a.dataset.nav === 'stock')));
  const el = $('#page');
  try { el.innerHTML = pg.render(App.route); if (pg.mount) pg.mount(App.route, el); }
  catch (e) { console.error(e); el.innerHTML = `<div class="notice bad">This page failed to load: ${esc(e.message)}</div>`; }
  $('#side') && $('#side').classList.remove('open');
}
function rerender() { const y = window.scrollY; renderShell(); route(); window.scrollTo(0, y); }
const go = h => { if (location.hash === h) route(); else location.hash = h; };
const denied = what => `<div class="empty"><h3>You don\u2019t have access to ${esc(what)}</h3><p>Ask an admin to grant the permission on Roles & permissions.</p></div>`;

/* ---------------- global actions ---------------- */
const ACT = {
  menu: () => $('#side').classList.toggle('open'),
  logout: () => { App.store.logout(); location.reload(); },
  notifs: async () => {
    const pop = $('#notifPop'); const list = myNotifications();
    if (!pop.classList.contains('hidden')) { pop.classList.add('hidden'); return; }
    pop.innerHTML = list.length ? list.map(n => `<div class="pop-item ${(n.readBy || []).includes(App.me.id) ? '' : 'unread'}" data-act="openNotif" data-id="${n.id}">${esc(n.text)}<div class="faint small">${rel(n.at)}</div></div>`).join('') : '<div class="empty small">No notifications.</div>';
    pop.classList.remove('hidden');
    for (const n of list.filter(n => !(n.readBy || []).includes(App.me.id))) { try { await App.store.update('notifications', n.id, { readBy: (n.readBy || []).concat(App.me.id) }); } catch (e) {} }
  },
  openNotif: el => { const n = byId('notifications', el.dataset.id); $('#notifPop').classList.add('hidden'); if (n && n.invoiceId) go('#/deals/' + n.invoiceId); rerender(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) {
    const pop = $('#notifPop'); if (pop && !e.target.closest('.pop')) pop.classList.add('hidden');
    return;
  }
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault();

});
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });

/* ---------------- boot ---------------- */
async function boot() {
  document.body.innerHTML = `<div class="login"><div class="boot-logo"><img src="${A.logoMain || A.logoHV}" alt="Horizon Vehicles"></div></div>`;
  const useApi = await S.detectApi();
  App.store = useApi ? S.ApiAdapter : S.LocalAdapter;
  try {
    const r = await App.store.init();
    App.data = r.data; App.meta = r.meta || {};
    App.me = r.me ? (byId('users', r.me.id) || r.me) : (byId('users', App.meta.viewingAs) || D('users')[0]);
  } catch (e) {
    if (useApi && e.status === 401) return renderLogin();
    document.body.innerHTML = `<div class="login"><div class="card"><h2>Couldn\u2019t start</h2><p class="muted">${esc(e.message)}</p></div></div>`;
    return;
  }
  renderShell(); route();
  setInterval(tickSla, 30000);
  if (useApi) setInterval(async () => { if (document.hidden || $('.overlay')) return; try { await App.store.refresh(); App.me = byId('users', App.me.id) || App.me; rerender(); } catch (e) {} }, 60000);
}
function renderLogin(msg) {
  document.body.innerHTML = `<div class="login"><form class="card stack" id="loginForm">
    <div><div class="brand-logo"><img src="${A.logoMain || A.logoHV}" alt="Horizon Vehicles"></div><h2 style="margin-top:6px">Sign in</h2><div class="muted small">Use your Horizon account email and password.</div></div>
    ${msg ? `<div class="notice bad">${esc(msg)}</div>` : ''}
    ${field('Email', '<input type="email" name="email" required autocomplete="username">')}
    ${field('Password', '<input type="password" name="password" required autocomplete="current-password">')}
    <button class="btn primary" type="submit">Sign in</button></form></div>`;
  $('#loginForm').onsubmit = async e => {
    e.preventDefault(); const v = formVals(e.target);
    try { await S.ApiAdapter.login(v.email, v.password); boot(); } catch (err) { renderLogin(err.message); }
  };
}
function tickSla() {
  $$('[data-sla]').forEach(el => { const inv = byId('invoices', el.dataset.sla); if (inv) el.outerHTML = slaBadge(inv, el.classList.contains('big')); });
}
function slaBadge(inv, big) {
  const s = R.slaState(inv); if (!s) return '';
  const days = R.num(settings().readyDays) || 7;
  if (!big) return `<span data-sla="${inv.id}" class="tag ${s.stopped ? 'ok' : s.overdue ? 'bad' : s.ms < 864e5 * 2 ? 'warn' : 'info'}">${s.stopped ? 'Ready' : s.overdue ? 'Overdue ' + dur(s.ms) : dur(s.ms) + ' left'}</span>`;
  const total = days * 864e5; const frac = s.stopped ? 1 : Math.max(0, Math.min(1, s.ms / total));
  const C = 2 * Math.PI * 17;
  const col = s.stopped ? '#1f8a4c' : s.overdue ? '#c8102e' : frac < .3 ? '#a2660a' : '#141218';
  return `<div data-sla="${inv.id}" class="big sla ${s.stopped ? 'done' : s.overdue ? 'over' : ''}"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="17" fill="none" stroke="#ecebf0" stroke-width="5"/><circle cx="21" cy="21" r="17" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - (s.overdue ? 1 : frac))}"/></svg>
    <div><div class="t">${s.stopped ? 'Ready' : s.overdue ? 'Overdue ' + dur(s.ms) : dur(s.ms)}</div><div class="l">${s.stopped ? 'Finished ' + fmtDate(inv.readyAt) : days + '-day readiness clock \u00b7 due ' + fmtDate(inv.readyDueAt)}</div></div></div>`;
}

<script>
/* Horizon Vehicles ERP — CRM pages: dashboard, tasks, customers, deals list. */

const COUNTRIES = ['Angola','Antigua and Barbuda','Bahamas','Burundi','D R Congo','Djibouti','Ethiopia','Guinea Bissau','Guyana','India','Jamaica','Japan','Kenya','Madagascar','Malawi','Mauritania','Mozambique','Pakistan','Rwanda','Senegal','Somalia','South Sudan','Suriname','Tanzania','Thailand','Tunisia','Uganda','United Arab Emirates','United Kingdom','Zambia','Zimbabwe','Other'];

function stageTag(inv) {
  const i = R.STAGE_INDEX[inv.stage];
  const cls = inv.stage === 'completed' ? 'ok' : inv.stage === 'sold' ? 'dark' : i >= R.STAGE_INDEX.stock_assigned ? 'brand' : i >= R.STAGE_INDEX.receipt_uploaded ? 'info' : '';
  return `<span class="tag ${cls}">${esc(R.STAGE[inv.stage].label)}</span>`;
}
function payTag(inv) {
  if (inv.paymentConfirmed) return '<span class="tag ok">Payment confirmed</span>';
  if (R.STAGE_INDEX[inv.stage] >= R.STAGE_INDEX.receipt_uploaded) return '<span class="tag warn">Awaiting SWIFT</span>';
  return '<span class="tag">Not paid</span>';
}
function taskLink(t) {
  if (t.kind === 'wo') return '#/workshop/' + t.wo.id;
  if (t.kind === 'acc') return '#/accessories';
  return '#/deals/' + t.inv.id + '/' + defaultTab(t.inv, t.kind);
}
function taskRow(t) {
  const c = t.inv ? customer(t.inv.customerId) : null;
  const left = t.inv ? `<span class="code">${esc(t.inv.invoiceNo)}</span> <span class="muted">${esc(c ? c.name : '')}</span>` : t.wo ? `<span class="code">${esc(t.wo.code)}</span>` : `<span class="code">${esc(t.acc.code)}</span>`;
  const tag = t.kind === 'sla' ? '<span class="tag bad">Overdue</span>' : t.kind === 'swift' ? '<span class="tag warn">Finance</span>' : t.kind === 'acc' ? '<span class="tag warn">Low stock</span>' : t.kind === 'wo' ? '<span class="tag brand">Work order</span>' : `<span class="tag info">${esc(R.STAGE[t.inv.stage].dept)}</span>`;
  return `<tr class="click" onclick="go('${taskLink(t)}')"><td>${tag}</td><td>${left}</td><td>${esc(t.text)}</td><td class="right">${t.inv && t.inv.stockId ? plate(t.inv.stockId) : ''}</td></tr>`;
}

/* ================= Dashboard ================= */
App.pages.dashboard = {
  render() {
    const hr = new Date().getHours();
    const hello = (hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening') + ', ' + App.me.name.split(' ')[0];
    const invs = visibleInvoices();
    const veh = D('vehicles');
    const month = new Date().toISOString().slice(0, 7);
    const soldMonth = invs.filter(i => i.soldAt && i.soldAt.slice(0, 7) === month);
    const tasks = myTasks();
    const locs = settings().stockLocations || ['UAE', 'Thailand', 'India', 'UK'];
    const inStock = v => !['Sold', 'Shipped'].includes(v.status);
    const running = invs.filter(i => i.readyDueAt && !i.readyAt).sort((a, b) => a.readyDueAt.localeCompare(b.readyDueAt));
    const fin = soldMonth.map(dealFinancials);
    const sum = k => fin.reduce((s, f) => s + f.pnl[k], 0);
    const recent = D('audit').filter(a => !a.invoiceId || invs.some(i => i.id === a.invoiceId)).slice(-8).reverse();
    return `
    <div class="page-head"><div><h1>${esc(hello)}</h1><p>${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })} \u2014 ${tasks.length ? tasks.length + ' thing' + (tasks.length > 1 ? 's' : '') + ' waiting on you' : 'nothing waiting on you'}.</p></div>
      <div class="row">${can('customers.create') ? `<button class="btn" data-act="newCustomer">${svg('plus')}New customer</button>` : ''}${can('invoices.create') ? `<button class="btn primary" data-act="newInvoice">${svg('plus')}New invoice</button>` : ''}</div></div>

    ${can('stock.view') ? `<div class="grid g4 section">${locs.map(l => { const n = veh.filter(v => v.location === l && inStock(v)).length; return `<a class="kpi" href="#/stock?loc=${encodeURIComponent(l)}"><div class="label">${esc(l)}</div><div class="value">${n.toLocaleString()}</div><div class="sub">vehicles in stock</div></a>`; }).join('')}</div>
    <div class="grid g4 section">
      <a class="kpi" href="#/stock"><div class="label">Available to sell</div><div class="value">${veh.filter(v => v.status === 'Available').length}</div><div class="sub">${veh.filter(v => v.status === 'On Hold').length} on hold \u00b7 ${veh.filter(v => v.status === 'Reserved').length} reserved</div></a>
      <a class="kpi" href="#/deals"><div class="label">Allocated to invoices</div><div class="value">${veh.filter(v => ['Allocated', 'In Workshop', 'Ready'].includes(v.status)).length}</div><div class="sub">${veh.filter(v => v.status === 'In Workshop').length} in workshop</div></a>
      <a class="kpi" href="#/deposit"><div class="label">Deposit inventory</div><div class="value">${veh.filter(v => v.inventoryType === 'deposit' && inStock(v)).length}</div><div class="sub">${can('stock.view_cost') ? money(veh.filter(v => v.inventoryType === 'deposit' && inStock(v)).reduce((s, v) => s + R.num(v.buyingPrice) - R.num(v.depositAmount), 0)) + ' still owed' : 'being paid off'}</div></a>
      ${can('accounts.view') ? `<a class="kpi accent" href="#/accounts"><div class="label">Net profit this month</div><div class="value">${money(sum('net'))}</div><div class="sub">${soldMonth.length} sold \u00b7 revenue ${money(sum('selling'))}</div></a>`
        : `<div class="kpi accent"><div class="label">Sold this month</div><div class="value">${soldMonth.length}</div><div class="sub">vehicles</div></div>`}
    </div>` : ''}

    ${can('invoices.view') ? `<div class="card section"><div class="card-head"><div><h2>Deal pipeline</h2><p>Every open invoice, by the step it\u2019s waiting on.</p></div><a class="btn sm" href="#/deals">Open board</a></div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(96px,1fr))">${R.STAGES.map(s => { const n = invs.filter(i => i.stage === s.key).length; return `<a class="kpi" style="padding:10px 12px" href="#/deals?stage=${s.key}"><div class="label">${s.label}</div><div class="value" style="font-size:22px">${n}</div></a>`; }).join('')}</div></div>` : ''}

    <div class="grid g2 section">
      <div class="card flush"><div class="card-head" style="padding:16px 18px 0"><div><h2>Waiting on you</h2><p>Based on your role\u2019s permissions.</p></div><a class="btn sm" href="#/tasks">All tasks</a></div>
        ${tasks.length ? `<div class="table-wrap"><table class="t"><tbody>${tasks.slice(0, 7).map(taskRow).join('')}</tbody></table></div>` : '<div class="empty"><h3>You\u2019re all caught up</h3><p>New work appears here as deals move to your department.</p></div>'}</div>
      <div class="card flush"><div class="card-head" style="padding:16px 18px 0"><div><h2>Readiness clock</h2><p>Vehicles must be ready ${settings().readyDays || 7} days after stock is assigned.</p></div></div>
        ${running.length ? `<div class="table-wrap"><table class="t"><tbody>${running.slice(0, 7).map(i => { const c = customer(i.customerId); return `<tr class="click" onclick="go('#/deals/${i.id}')"><td>${plate(i.stockId)}</td><td><span class="code">${esc(i.invoiceNo)}</span> <span class="muted">${esc(c ? c.name : '')}</span></td><td>${stageTag(i)}</td><td class="right">${slaBadge(i)}</td></tr>`; }).join('')}</tbody></table></div>` : '<div class="empty"><h3>No clocks running</h3><p>A clock starts when Operations assigns a stock ID.</p></div>'}</div>
    </div>

    ${can('audit.view') ? `<div class="card section"><div class="card-head"><h2>Recent activity</h2><a class="btn sm" href="#/activity">Full log</a></div>
      ${recent.length ? `<ul class="feed">${recent.map(a => `<li><div class="avatar sm">${esc(initials(a.userName))}</div><div><b>${esc(a.userName)}</b> ${esc(a.action)}${a.detail ? ' \u2014 <span class="muted">' + esc(a.detail) + '</span>' : ''}</div><time>${rel(a.at)}</time></li>`).join('')}</ul>` : '<div class="empty small">No activity yet.</div>'}</div>` : ''}`;
  },
};

/* ================= My tasks ================= */
App.pages.tasks = {
  render() {
    const tasks = myTasks();
    return `<div class="page-head"><div><h1>My tasks</h1><p>Everything that needs an action from ${esc(roleOf(App.me).name)}. Tasks disappear once the step is done.</p></div></div>
      <div class="card flush">${tasks.length ? `<div class="table-wrap"><table class="t"><thead><tr><th>Type</th><th>Record</th><th>What to do</th><th class="right">Stock</th></tr></thead><tbody>${tasks.map(taskRow).join('')}</tbody></table></div>`

/* ================= Customers ================= */
function customerForm(c) {
  c = c || {};
  const reps = D('users').filter(u => u.active !== false && roleOf(u).permissions['invoices.create']);
  return `<div class="form-grid">
    ${field('Full name *', `<input type="text" name="name" value="${esc(c.name)}">`)}
    ${field('Company <em>(optional)</em>', `<input type="text" name="company" value="${esc(c.company)}">`)}
    ${field('Email *', `<input type="email" name="email" value="${esc(c.email)}"><span class="hint">Must be unique \u2014 used to prevent duplicate customers.</span>`)}
    ${field('Phone *', `<input type="tel" name="phone" value="${esc(c.phone)}" placeholder="+254700000000"><span class="hint">International format with country code. Must be unique.</span>`)}
    ${field('WhatsApp <em>(if different)</em>', `<input type="tel" name="whatsapp" value="${esc(c.whatsapp)}" placeholder="+254\u2026">`)}
    ${field('Customer type', `<select name="customerType">${['Individual', 'Dealer', 'Company', 'Government'].map(t => opt(t, t, c.customerType || 'Individual')).join('')}</select>`)}
    ${field('Country *', `<select name="country"><option value="">Select\u2026</option>${COUNTRIES.map(x => opt(x, x, c.country)).join('')}</select>`)}
    ${field('City', `<input type="text" name="city" value="${esc(c.city)}">`)}
    ${field('Address', `<input type="text" name="address" value="${esc(c.address)}">`, 'full')}
    ${field('Passport / national ID <em>(optional)</em>', `<input type="text" name="idNumber" value="${esc(c.idNumber)}">`)}
    ${field('Assigned sales person', `<select name="salesUserId">${reps.map(u => opt(u.id, u.name, c.salesUserId || App.me.id)).join('')}</select>`)}
    ${field('Notes', `<textarea name="notes">${esc(c.notes)}</textarea>`, 'full')}
    <div class="full" id="dupHint"></div></div>`;
}
function dupCheck(m, selfId) {
  const v = formVals(m); const e = R.normEmail(v.email), p = R.normPhone(v.phone);
  const clash = D('customers').find(x => x.id !== selfId && ((e && x.emailNorm === e) || (p && x.phoneNorm === p)));
  $('#dupHint', m).innerHTML = clash ? `<div class="notice warn">This ${clash.emailNorm === e ? 'email' : 'phone number'} already belongs to <b>${esc(clash.code)} ${esc(clash.name)}</b>. Each customer can only exist once \u2014 <a href="#/customers/${clash.id}" data-close>open the existing account</a> instead.</div>` : '';
  return clash;
}
function openCustomerModal(c, after) {
  modal({ title: c ? 'Edit ' + c.code : 'New customer', sub: c ? '' : 'A unique customer ID is generated automatically.', body: customerForm(c), wide: true,
    onOpen: m => { ['email', 'phone'].forEach(n => $(`[name=${n}]`, m).addEventListener('input', () => dupCheck(m, c && c.id))); },
    foot: [{ label: 'Cancel' }, { label: c ? 'Save changes' : 'Create customer', cls: 'primary', act: async m => {
      need(m, ['name', 'email', 'phone', 'country']);
      const v = formVals(m);
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) throw new Error('Enter a valid email address.');
      if (!/^\+[1-9]\d{7,14}$/.test(v.phone.replace(/[\s-]/g, ''))) throw new Error('Phone must be in international format, e.g. +254700000000.');
      v.phone = v.phone.replace(/[\s-]/g, ''); if (!v.whatsapp) v.whatsapp = v.phone;
      if (dupCheck(m, c && c.id)) throw new Error('Duplicate customer \u2014 see the message above.');
      let rec;
      if (c) { rec = await svc.update('customers', c.id, v); await svc.audit('customer', c.id, 'Updated customer ' + c.code); }
      else { rec = await svc.insert('customers', v); await svc.audit('customer', rec.id, 'Created customer ' + rec.code, rec.name); toast(rec.code + ' created for ' + rec.name, 'ok'); }
      if (after) after(rec);
    } }] });
}

      ${can('invoices.create') ? `<button class="btn primary" data-act="newInvoice" data-customer="${c.id}">${svg('plus')}New invoice</button>` : ''}</div></div>
    <div class="grid g4 section">
      <div class="kpi"><div class="label">Invoices</div><div class="value">${invs.length}</div><div class="sub">${invs.filter(i => i.stage !== 'completed').length} open</div></div>
      <div class="kpi"><div class="label">Total billed</div><div class="value">${money(billed)}</div></div>
      <div class="kpi"><div class="label">Payment confirmed</div><div class="value">${money(paid)}</div><div class="sub">${money(billed - paid)} outstanding</div></div>
      <div class="kpi"><div class="label">Vehicles</div><div class="value">${invs.filter(i => i.stockId).length}</div><div class="sub">${invs.filter(i => i.stage === 'completed').length} shipped</div></div>
    </div>

          ${invs.length ? `<div class="table-wrap"><table class="t"><thead><tr><th>Invoice</th><th>Date</th><th>Vehicle</th><th>Stock / chassis</th><th>Stage</th><th>Payment</th><th class="num">Total</th></tr></thead><tbody>
          ${invs.map(i => `<tr class="click" onclick="go('#/deals/${i.id}')"><td><span class="code">${esc(i.invoiceNo)}</span></td><td class="nowrap">${fmtDate(i.date)}</td><td>${esc((i.rows || [])[0] ? i.rows[0].makeModel : '')}</td><td>${plate(i.stockId)} <span class="small muted">${esc(i.chassisNo || '')}</span></td><td>${stageTag(i)}</td><td>${payTag(i)}</td><td class="num">${money(R.invoiceTotal(i))}</td></tr>`).join('')}
          </tbody></table></div>` : '<div class="empty"><h3>No invoices yet</h3><p>Raise the first invoice for this customer.</p></div>'}</div>
        <div class="card"><div class="card-head"><h2>Documents</h2><span class="muted small">${docs.length} files across all invoices</span></div>
          ${docs.length ? `<ul class="doclist">${docs.map(d => `<li><span><b>${esc(R.DOC_TYPES[d.docType] || d.docType)}</b> \u2014 <a href="${esc(fileUrl(d))}" target="_blank" rel="noopener">${esc(d.name)}</a></span><span class="muted">${esc((byId('invoices', d.invoiceId) || {}).invoiceNo || '')} \u00b7 ${fmtDate(d.uploadedAt)}</span></li>`).join('')}</ul>` : '<span class="faint small">No documents yet.</span>'}</div>

          <tr><td class="muted">WhatsApp</td><td>${esc(c.whatsapp || c.phone)}</td></tr><tr><td class="muted">Address</td><td>${esc(c.address || '\u2014')}</td></tr>
          <tr><td class="muted">ID no.</td><td>${esc(c.idNumber || '\u2014')}</td></tr><tr><td class="muted">Sales person</td><td>${esc(userName(c.salesUserId))}</td></tr>
          </tbody></table>${c.notes ? `<p class="small muted" style="white-space:pre-wrap">${esc(c.notes)}</p>` : ''}</div>
        <div class="card"><h2 style="margin-bottom:6px">History</h2>${log.length ? `<ul class="feed">${log.map(a => `<li><div><b>${esc(a.userName)}</b> ${esc(a.action)}</div><time>${rel(a.at)}</time></li>`).join('')}</ul>` : '<span class="faint small">Nothing yet.</span>'}</div>

      <div class="toolbar"><div class="seg"><button class="${view === 'table' ? 'on' : ''}" data-act="dealView" data-v="table">Table</button><button class="${view === 'board' ? 'on' : ''}" data-act="dealView" data-v="board">Board</button></div>
        <input type="search" id="dealQ" placeholder="Invoice, customer, stock ID, chassis" value="${esc(App.ui.dealQ || '')}">

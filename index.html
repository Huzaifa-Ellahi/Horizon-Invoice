          ${field('Address', `<input type="text" data-cf="address" value="${esc(co.address)}">`, 'full')}${field('Phone / web line', `<input type="text" data-cf="phoneLine" value="${esc(co.phoneLine)}">`, 'full')}</div>
        <div class="row" style="margin-top:10px"><button class="btn sm" data-act="coImg" data-id="${co.id}" data-k="logoFile">Replace logo</button><button class="btn sm" data-act="coImg" data-id="${co.id}" data-k="stampFile">Replace stamp</button></div>
        <div class="fset"><h3>Payment methods</h3><div class="grid g2">${(co.paymentMethods || []).map((p, pi) => `<div class="docslot"><div class="row between"><input type="text" data-pm="${pi}" data-pk="label" value="${esc(p.label)}" style="font-weight:700;max-width:320px"><button class="btn sm danger" data-act="pmDel" data-id="${co.id}" data-pi="${pi}">Remove</button></div>
          ${(p.fields || []).map((f, fi) => `<div class="row" style="margin-top:6px"><input type="text" data-pm="${pi}" data-fi="${fi}" data-fk="label" value="${esc(f.label)}" style="max-width:170px"><input type="text" class="grow" data-pm="${pi}" data-fi="${fi}" data-fk="value" value="${esc(f.value)}" style="width:auto;flex:1"><button class="btn sm ghost" data-act="pmFieldDel" data-id="${co.id}" data-pi="${pi}" data-fi="${fi}" aria-label="Remove field">\u2715</button></div>`).join('')}
          <button class="btn sm" style="margin-top:8px" data-act="pmFieldAdd" data-id="${co.id}" data-pi="${pi}">Add field</button></div>`).join('')}</div>
          <div class="row" style="margin-top:10px"><button class="btn sm" data-act="pmAdd" data-id="${co.id}">Add payment method</button><div class="grow"></div><button class="btn primary" data-act="coSave" data-id="${co.id}">Save company</button></div></div></div>`).join('')}</div>`;
  },
};
function coFromForm(id) {
  const co = JSON.parse(JSON.stringify(byId('companies', id))); const card = $(`[data-co="${id}"]`);
  $$('[data-cf]', card).forEach(i => co[i.dataset.cf] = i.value.trim());
  $$('[data-pk]', card).forEach(i => co.paymentMethods[+i.dataset.pm].label = i.value);
  $$('[data-fk]', card).forEach(i => co.paymentMethods[+i.dataset.pm].fields[+i.dataset.fi][i.dataset.fk] = i.value);
  return co;
}
const coPatch = async (id, fn) => { const co = coFromForm(id); fn(co); await svc.update('companies', id, co); route(); };
ACT.coSave = async el => { const co = coFromForm(el.dataset.id); await svc.update('companies', co.id, co); await svc.audit('company', co.id, 'Updated company ' + co.name); toast('Saved.', 'ok'); route(); };
ACT.pmAdd = el => coPatch(el.dataset.id, co => co.paymentMethods.push({ id: S.uid('pm'), label: 'New payment method', fields: [{ id: S.uid('f'), label: 'Bank Name', value: '' }] }));
ACT.pmDel = el => coPatch(el.dataset.id, co => co.paymentMethods.splice(+el.dataset.pi, 1));
ACT.pmFieldAdd = el => coPatch(el.dataset.id, co => co.paymentMethods[+el.dataset.pi].fields.push({ id: S.uid('f'), label: '', value: '' }));
ACT.pmFieldDel = el => coPatch(el.dataset.id, co => co.paymentMethods[+el.dataset.pi].fields.splice(+el.dataset.fi, 1));
ACT.coImg = async el => { const f = await pickFiles({ accept: 'image/*' }); if (!f.length) return; const [meta] = await svc.upload(f); await svc.update('companies', el.dataset.id, { [el.dataset.k]: meta }); toast('Image updated.', 'ok'); route(); };

/* ================= Activity log ================= */
App.pages.activity = {
  render() {
    if (!can('audit.view')) return denied('the activity log');
    const q = (App.ui.logQ || '').toLowerCase();
    const log = D('audit').filter(a => !q || [a.userName, a.action, a.detail].join(' ').toLowerCase().includes(q)).slice().reverse().slice(0, 400);
    return `<div class="page-head"><div><h1>Activity log</h1><p>Every change, who made it and when. Entries can\u2019t be edited.</p></div></div>
      <div class="toolbar"><input type="search" id="logQ" placeholder="Filter by person or action" value="${esc(App.ui.logQ || '')}"></div>
      <div class="card flush"><div class="table-wrap"><table class="t"><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Detail</th><th>Record</th></tr></thead><tbody>
      ${log.map(a => { const inv = a.invoiceId ? byId('invoices', a.invoiceId) : null; return `<tr><td class="nowrap">${fmtDT(a.at)}</td><td>${esc(a.userName)}</td><td>${esc(a.action)}</td><td class="muted">${esc(a.detail)}</td><td>${inv ? `<a class="code" href="#/deals/${inv.id}">${esc(inv.invoiceNo)}</a>` : esc(a.entity)}</td></tr>`; }).join('') || '<tr><td colspan="5"><div class="empty small">No activity.</div></td></tr>'}</tbody></table></div></div>`;
  },
  mount() { const q = $('#logQ'); if (q) q.oninput = () => { App.ui.logQ = q.value; const p = q.selectionStart; route(); const n = $('#logQ'); n.focus(); n.setSelectionRange(p, p); }; },
};

/* ================= Settings ================= */
App.pages.settings = {
  render() {
    if (!can('settings.manage')) return denied('settings');
    const s = settings(); const local = App.store.mode === 'local';
    return `<div class="page-head"><div><h1>Settings</h1></div></div><div class="stack">
      <div class="card" id="setForm"><h2 style="margin-bottom:12px">Workflow & finance</h2><div class="form-grid">
        ${field('Readiness clock (days after stock is assigned)', `<input type="number" name="readyDays" min="1" value="${esc(s.readyDays || 7)}">`)}
        ${field('Commission is calculated on', `<select name="commissionBasis">${opt('profit', 'Profit before commission (selling \u2212 total cost)', s.commissionBasis)}${opt('selling', 'Selling price', s.commissionBasis)}</select>`)}
        ${field('Default currency', `<input type="text" name="currency" value="${esc(s.currency || 'USD')}">`)}
        ${field('Stock locations (comma separated)', `<input type="text" name="stockLocations" value="${esc((s.stockLocations || []).join(', '))}">`)}
        ${field('Default invoice notes', `<textarea name="invoiceNotes">${esc(s.invoiceNotes)}</textarea>`, 'full')}</div>
        <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" data-act="saveSettings">Save settings</button></div></div>
      <div class="card"><h2 style="margin-bottom:8px">Database</h2>${local ? `<p class="muted">You\u2019re running the <b>local demo database</b> in this browser (IndexedDB). Data stays on this device. Deploy the included Node + PostgreSQL server to share one database across your team.</p>
        <div class="row"><button class="btn" data-act="backup">Download backup (JSON)</button><button class="btn" data-act="restore">Restore from backup</button><button class="btn danger" data-act="resetDemo">Reset demo data</button></div>`
        : '<p class="muted">Connected to the Horizon Vehicles server (PostgreSQL). Back up with <code>pg_dump</code> \u2014 see the README.</p>'}</div></div>`;
  },
};
ACT.saveSettings = async () => { const v = formVals($('#setForm')); v.readyDays = R.num(v.readyDays) || 7; v.stockLocations = String(v.stockLocations).split(',').map(x => x.trim()).filter(Boolean); await svc.update('settings', 'app', v); await svc.audit('settings', 'app', 'Updated settings'); toast('Settings saved.', 'ok'); rerender(); };
ACT.backup = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([App.store.exportJson()], { type: 'application/json' })); a.download = 'horizon-vehicles-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); };
ACT.restore = async () => { const f = await pickFiles({ accept: 'application/json' }); if (!f.length) return; await App.store.importJson(await f[0].text()); location.reload(); };
ACT.resetDemo = async () => { if (await confirmBox('Reset demo data?', 'This erases everything in this browser\u2019s local database and reloads the starting data.', 'Reset', 'danger')) { await App.store.reset(); location.reload(); } };

</script>
<script>boot();</script>
</body>
</html>
